[defaults]
inject_facts_as_vars = false
ansible_managed = Managed by Ansible (Get-Sybers FGNW) - do not edit by hand; changes will be overwritten.
interpreter_python = auto_silent
collections_path = tests/collections:~/.ansible/collections:/usr/share/ansible/collections
roles_path = ansible/roles
[privilege_escalation]
become = false
become_method = sudo
