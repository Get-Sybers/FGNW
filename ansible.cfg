[defaults]
inject_facts_as_vars = false
ansible_managed = Managed by Ansible (Get-Sybers FGNW) - do not edit by hand; changes will be overwritten.
interpreter_python = auto_silent
# ~/.ansible/collections first: it is where ansible-galaxy installs requirements.yml
# (the first entry is the install target). tests/collections holds only the symlinks
# that make the in-tree collections resolvable as get_sybers.range / get_sybers.templates.
collections_path = ~/.ansible/collections:tests/collections:/usr/share/ansible/collections
roles_path = ansible/roles
[privilege_escalation]
become = false
become_method = sudo
