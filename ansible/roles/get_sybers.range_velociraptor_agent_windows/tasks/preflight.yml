---
- name: "preflight | Velociraptor_host is defined and non-empty"
  ansible.builtin.assert:
    that:
      - velociraptor_host is defined
      - (velociraptor_host | string | trim | length) > 0
    fail_msg: >-
      velociraptor_host is required and has no default (it identifies the
      Velociraptor server to enroll against). Fix: set it in the range
      config's role_vars for this role (e.g. velociraptor_host:
      "10.<range>.10.50" or a DNS hostname), or pass -e velociraptor_host=...
    quiet: true
- name: "preflight | Hostname-form velociraptor_host is hostname-shaped"
  ansible.builtin.assert:
    that:
      - velociraptor_host | string is match('^[A-Za-z][A-Za-z0-9.-]*$')
    fail_msg: >-
      velociraptor_host='{{ velociraptor_host }}' starts with a letter, so the
      role uses it verbatim as the Velociraptor server hostname (and as the
      DNS A-record name on domain controllers) — but it contains characters
      that are not valid in a hostname. Fix: pass a plain DNS hostname
      (letters, digits, dots, hyphens — no scheme/port/path) or a plain IPv4
      address in velociraptor_host.
    quiet: true
  when: velociraptor_host | string is match('^[a-zA-Z]')
- name: "preflight | Non-hostname velociraptor_host is actually an IPv4 address"
  ansible.builtin.assert:
    that:
      - velociraptor_host | string is match('^\d{1,3}(\.\d{1,3}){3}$')
    fail_msg: >-
      velociraptor_host='{{ velociraptor_host }}' does not start with a
      letter, so the role treats it as an IPv4 address — but it does not look
      like one. Fix: pass either a plain IPv4 address or a DNS hostname
      starting with a letter in velociraptor_host.
    quiet: true
  when: velociraptor_host | string is not match('^[a-zA-Z]')
- name: "preflight | Range_id yields a valid derived hostname when velociraptor_host is an IP"
  ansible.builtin.assert:
    that:
      - range_id is defined
      - (range_id | string | trim | length) > 0
      - ((range_id | string) ~ '-velociraptor') is match('^[A-Za-z0-9][A-Za-z0-9-]{0,62}$')
    fail_msg: >-
      velociraptor_host ('{{ velociraptor_host }}') is an IP address, so the
      Velociraptor server hostname is derived as "<range_id>-velociraptor" —
      but range_id ('{{ range_id | default('<undefined>') }}') is missing or
      would not form a valid DNS label. Fix: run this role via `ludus range
      deploy` (which supplies range_id automatically), or pass
      -e range_id=<RANGEID>, or set velociraptor_host to the server's DNS
      hostname instead of its IP.
    quiet: true
  when: velociraptor_host | string is not match('^[a-zA-Z]')
