---
- name: Ensure OS facts are present (the guard needs ansible_facts['distribution'])
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - distribution
  when: ansible_facts['distribution'] is not defined
- name: Skip distros with no Nexus base-OS proxy (e.g. Ubuntu)
  ansible.builtin.meta: end_host
  when: (ansible_facts['distribution'] | default('')) not in range_nexus_apt_sources
- name: Tolerate range clock skew (Nexus serves upstream-dated Release files)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-nexus-clockskew
    owner: root
    group: root
    mode: "0644"
    content: |
      Acquire::Max-FutureTime "{{ range_nexus_apt_max_future_seconds }}";
      Acquire::Check-Valid-Until "false";
  when: range_nexus_apt_tolerate_clock_skew | bool
- name: "Route apt through the Nexus proxies for {{ ansible_facts['distribution'] }}"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nexus-{{ ansible_facts['distribution'] | lower }}.list
    owner: root
    group: root
    mode: "0644"
    content: "{{ range_nexus_apt_sources[ansible_facts['distribution']] | join('\n') + '\n' }}"
- name: "Disable the stock public sources.list (can't resolve under containment)"
  ansible.builtin.command:
    argv: [mv, /etc/apt/sources.list, /etc/apt/sources.list.disabled]
    removes: /etc/apt/sources.list
- name: "Disable any remaining stock public entries in sources.list.d (e.g. Kali's kali.list)"
  ansible.builtin.shell:
    cmd: |
      set -e -o pipefail
      shopt -s nullglob
      for f in /etc/apt/sources.list.d/*.list; do
        case "$f" in */nexus-*) continue;; esac
        if grep -qiE 'deb\.debian\.org|security\.debian\.org|http\.kali\.org|kali\.download|\.ubuntu\.com' "$f"; then
          mv "$f" "$f.disabled"
        fi
      done
    executable: /bin/bash
  changed_when: false
- name: Refresh the apt cache from Nexus
  ansible.builtin.apt:
    update_cache: true
  register: __rna_update
  retries: 3
  delay: 5
  until: __rna_update is succeeded
