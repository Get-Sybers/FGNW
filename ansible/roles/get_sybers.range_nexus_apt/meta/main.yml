---
galaxy_info:
  author: Get-Sybers
  description: >
    Point an apt-based range VM at the Nexus apt proxies (192.0.2.2:8081) instead of the stock
    public repos, so apt works inside the contained range: Debian -> debian-proxy /
    debian-security-proxy, Kali -> kali-proxy (kali-rolling). Extension of the sources.list
    rewrite in campaign/ansible/FGNW-ninjasploitable-join.yml (
    before roles that apt-install. Tolerates the range's clock
    skew. Distros with no Nexus base-OS proxy (Ubuntu) are skipped. FGNW
  role_name: range_nexus_apt
  license: AGPL-3.0-only
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - all
    - name: Kali
      versions:
        - all
dependencies: []
