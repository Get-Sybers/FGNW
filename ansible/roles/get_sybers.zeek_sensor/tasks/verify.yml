---
- name: "verify | Let Zeek settle before reading its counters"
  ansible.builtin.wait_for:
    timeout: "{{ zeek_sensor_verify_settle_seconds }}"
- name: "verify | Ask zeekctl for node status"
  ansible.builtin.command: "{{ zeek_sensor_bin }} status"
  become: "{{ zeek_sensor_user != 'root' }}"
  become_user: "{{ zeek_sensor_user }}"
  environment:
    HOME: /
  register: __zeek_status
  changed_when: false
  failed_when: __zeek_status.rc != 0
- name: "verify | No node is in a non-running state"
  ansible.builtin.assert:
    that:
      - __zeek_status.stdout is search('running')
      - __zeek_status.stdout is not search('crashed')
      - __zeek_status.stdout is not search('stopped')
    fail_msg: >-
      zeekctl reports at least one node not running. systemd will still call the
      unit successful, which is why this is checked here.
      {{ __zeek_status.stdout | trim }}
      Run `{{ zeek_sensor_bin }} diag` on the host for the crash report.
    quiet: true
- name: "verify | One worker exists per configured capture interface"
  ansible.builtin.assert:
    that: >-
      (__zeek_status.stdout_lines | select('search', 'running') | list | length)
      >= (zeek_sensor_effective_interfaces | length)
    fail_msg: >-
      {{ zeek_sensor_effective_interfaces | length }} capture interface(s) were
      configured ({{ zeek_sensor_effective_interfaces | join(', ') }}) but
      zeekctl reports fewer running nodes than that. An interface that silently
      lost its worker is an interface nobody is watching.
      {{ __zeek_status.stdout | trim }}
    quiet: true
- name: "verify | Read Zeek's own capture counters"
  ansible.builtin.command: "{{ zeek_sensor_bin }} netstats"
  become: "{{ zeek_sensor_user != 'root' }}"
  become_user: "{{ zeek_sensor_user }}"
  environment:
    HOME: /
  register: __zeek_netstats
  changed_when: false
  failed_when: __zeek_netstats.rc != 0
- name: "verify | Total the frames Zeek says it received"
  ansible.builtin.set_fact:
    __zeek_recvd: >-
      {{ __zeek_netstats.stdout
         | regex_findall('recvd=([0-9]+)')
         | map('int') | sum }}
    __zeek_dropped: >-
      {{ __zeek_netstats.stdout
         | regex_findall('dropped=([0-9]+)')
         | map('int') | sum }}
- name: "verify | Zeek is receiving packets and writing logs"
  ansible.builtin.include_tasks: verify-packets.yml
  when: zeek_sensor_require_packets | bool
- name: "verify | Report capture loss"
  ansible.builtin.debug:
    msg: >-
      Zeek received {{ __zeek_recvd }} frames, dropped {{ __zeek_dropped }}
      ({{ ((__zeek_dropped | int) * 100.0
           / ([(__zeek_recvd | int) + (__zeek_dropped | int), 1] | max)) | round(2) }}%).
      Sustained loss above a few percent means this node needs more capture
      capacity — narrow zeek_sensor_capture_filter or split the interfaces
      across more workers.
- name: "verify | The deployed site policy carries our marker"
  ansible.builtin.command: >-
    grep -c "get_sybers.zeek_sensor managed policy" {{ zeek_sensor_sitedir }}/local.zeek
  register: __zeek_policy_marker
  changed_when: false
  failed_when: __zeek_policy_marker.stdout | trim | int < 1
- name: "verify | The live configuration still parses"
  ansible.builtin.command: "{{ zeek_sensor_bin }} check"
  become: "{{ zeek_sensor_user != 'root' }}"
  become_user: "{{ zeek_sensor_user }}"
  environment:
    HOME: /
  register: __zeek_verify_check
  changed_when: false
  failed_when: __zeek_verify_check.rc != 0
- name: "verify | The retention settings zeekctl resolved are ours"
  ansible.builtin.include_tasks: verify-retention.yml
  when: zeek_sensor_manage_retention | bool
# service_facts reports .service units only; the state of a timer unit is readable
# through systemctl alone, so the probe stays a read-only command.
- name: "verify | The zeekctl cron timer is active" # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active zeek-sensor-cron.timer
  register: __zeek_cron_active
  changed_when: false
  failed_when: __zeek_cron_active.stdout | trim != 'active'
- name: "verify | Report"
  ansible.builtin.debug:
    msg: >-
      Zeek sensor verified on {{ inventory_hostname }}
      (profile: {{ zeek_sensor_profile }}).
      Capturing: {{ zeek_sensor_effective_interfaces | join(', ') }}.
      Zeek's own counters: recvd={{ __zeek_recvd }}, dropped={{ __zeek_dropped }}.
      Retention aims at {{ zeek_sensor_log_expire_days }} days, capped at
      {{ zeek_sensor_log_max_use_mb }} MiB — whichever is hit first wins, and on
      a busy range that is the size cap, not the age.
      NOT PROVEN by this run: that EVERY class of traffic is visible from here.
      See README.md § What this does NOT prove.
