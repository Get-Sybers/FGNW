---
- name: "verify-retention | Verify — read zeekctl's effective configuration back"
  ansible.builtin.command: "{{ zeek_sensor_bin }} config"
  register: __zeek_cfg_verify
  changed_when: false
- name: "verify-retention | Verify — the retention values zeekctl resolved are ours"
  ansible.builtin.assert:
    that:
      - __zeek_cfg_verify.stdout is search('logexpireinterval\\s*=\\s*' ~ zeek_sensor_log_expire_days ~ '\\b')
      - __zeek_cfg_verify.stdout is search('cronenabled\\s*=\\s*1\\b')
    fail_msg: >-
      zeekctl.cfg was written but zeekctl does not report our values as
      effective. Expected logexpireinterval={{ zeek_sensor_log_expire_days }}
      and cronenabled=1. Something later in zeekctl.cfg is overriding them, or
      the key was appended rather than replaced. Effective values:
      {{ __zeek_cfg_verify.stdout_lines
         | select('search', 'expireinterval|cronenabled') | list }}
    quiet: true
# service_facts reports .service units only; the state of a timer unit is readable
# through systemctl alone, so the probe stays a read-only command.
- name: "verify-retention | Verify — the prune timer is active" # noqa: command-instead-of-module
  ansible.builtin.command: systemctl is-active zeek-sensor-prune.timer
  register: __zeek_prune_active
  changed_when: false
  failed_when: __zeek_prune_active.stdout | trim != 'active'
