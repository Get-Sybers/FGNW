---
- name: "install-service-account | Install — create the unprivileged service account"
  ansible.builtin.group:
    name: "{{ zeek_sensor_group }}"
    system: true
- name: "install-service-account | Install — create the service user"
  ansible.builtin.user:
    name: "{{ zeek_sensor_user }}"
    group: "{{ zeek_sensor_group }}"
    home: /nonexistent
    create_home: false
    shell: /usr/sbin/nologin
    system: true
# `command -v` is a shell builtin (no module resolves a PATH lookup), so this probe
# needs the shell; it reads and never changes anything.
- name: "install-service-account | Install — locate the zeek binary" # noqa: command-instead-of-shell
  ansible.builtin.shell: "command -v zeek"
  register: __zeek_bin_which
  changed_when: false
  failed_when: __zeek_bin_which.rc != 0
- name: "install-service-account | Install — read current file capabilities on zeek"
  ansible.builtin.command:
    argv: [getcap, "{{ __zeek_bin_which.stdout | trim }}"]
  register: __zeek_getcap
  changed_when: false
  failed_when: false
- name: "install-service-account | Install — grant CAP_NET_RAW/CAP_NET_ADMIN to the zeek binary"
  ansible.builtin.include_tasks: install-setcap.yml
  when: >-
    'cap_net_raw' not in (__zeek_getcap.stdout | default(''))
    or 'cap_net_admin' not in (__zeek_getcap.stdout | default(''))
- name: "install-service-account | Install — read back the capabilities"
  ansible.builtin.command:
    argv: [getcap, "{{ __zeek_bin_which.stdout | trim }}"]
  register: __zeek_getcap_after
  changed_when: false
- name: "install-service-account | Install — assert the capabilities are really set"
  ansible.builtin.assert:
    that:
      - "'cap_net_raw' in __zeek_getcap_after.stdout"
      - "'cap_net_admin' in __zeek_getcap_after.stdout"
    fail_msg: >-
      setcap ran but {{ __zeek_bin_which.stdout | trim }} does not carry
      cap_net_raw,cap_net_admin — getcap reports
      '{{ __zeek_getcap_after.stdout | trim | default("nothing") }}'.
      File capabilities are silently dropped on a filesystem mounted nosuid or
      without xattr support. An unprivileged Zeek cannot open a capture socket
      without them, so it would start and see nothing. Either fix the mount or
      set zeek_sensor_user=root.
    quiet: true
