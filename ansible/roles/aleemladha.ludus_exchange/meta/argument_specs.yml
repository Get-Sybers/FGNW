---
# Argument spec for the vendored aleemladha.ludus_exchange role (see
# meta/upstream.yml for its provenance). The entries describe the inputs the
# role's defaults/main.yml declares; the role's own files are upstream's.
argument_specs:
  main:
    short_description: Unattended Exchange 2019 / 2016 install on a Ludus range VM
    description:
      - Installs the prerequisites, downloads the Exchange ISO, prepares the
        schema and the forest, runs the unattended installer and configures a
        send connector. The range-config entry names the role on the mail
        server VM; Ludus supplies the ludus/defaults facts it reads.
    options:
      ludus_install_directory:
        type: str
        default: /opt/ludus
        description: The Ludus install root on the server.
      exchange_accept_license_flag:
        type: str
        default: /IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF
        description: The licence switch Setup.exe is given (CU11+ form; the local patch over upstream).
      exchange_dotnet_install_path:
        type: str
        description: Download URL of the .NET Framework 4.8 offline installer.
      vcredist2013_install_path:
        type: str
        description: Download URL of the Visual C++ 2013 redistributable.
      rewrite_module_path:
        type: str
        description: Download URL of the IIS URL Rewrite module.
      ucma_runtime_path:
        type: str
        description: Download URL of the UCMA 4.0 runtime.
      ludus_exchange_iso_directory:
        type: str
        default: C:\ludus
        description: Where the Exchange ISO is stored on the VM.
      ludus_exchange_iso_url:
        type: str
        description: Download URL of the Exchange 2019 ISO.
      ludus_exchange2016_iso_url:
        type: str
        description: Download URL of the Exchange 2016 ISO.
      ludus_exchange_domain:
        type: str
        description: The VM's domain (NetBIOS part), derived from the Ludus range facts.
      ludus_exchange_dc:
        type: str
        description: The primary domain controller of that domain, derived from the range facts.
      ludus_exchange_host:
        type: str
        description: The VM's hostname, derived from the range facts.
      ludus_exchange_domain_username:
        type: str
        description: The domain admin account Setup.exe runs as.
      ludus_exchange_domain_password:
        type: str
        description: That account's password (from the Ludus defaults).
      ludus_os_version:
        type: str
        description: The Proxmox-reported OS version id of the VM.
      exchange_prereqs_complete_file:
        type: str
        default: C:\ludus\exchange_prereqs_complete.txt
        description: Marker written once the prerequisites are installed.
      send_connector_name:
        type: str
        default: ""
        description: Name of the send connector to create; empty skips it.
      send_connector_smtpserver:
        type: str
        default: ""
        description: Smart host the send connector relays to.
      send_connector_address_spaces:
        type: list
        elements: str
        default: ["SMTP:*;1"]
        description: Address spaces of the send connector.
      send_connector_source_transport_servers:
        type: str
        description: Transport server of the send connector (this VM by default).
