---
- name: "audit_policy | Enable full command-line auditing on process-creation events (4688)"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit
    name: ProcessCreationIncludeCmdLine_Enabled
    data: 1
    type: dword
- name: "audit_policy | Enable the Process Creation audit subcategory (success + failure) so 4688 is generated"
  community.windows.win_audit_policy_system:
    subcategory: Process Creation
    audit_type: success, failure
- name: "audit_policy | Enable PowerShell Script Block Logging"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: 1
    type: dword
- name: "audit_policy | Enable the Microsoft-Windows-PowerShell/Operational channel"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-PowerShell/Operational
    name: Enabled
    data: 1
    type: dword
- name: "audit_policy | Set the PowerShell/Operational log MaxSize to 64 MB (same over-verbosity reasoning as Application/System)"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-PowerShell/Operational
    name: MaxSize
    data: 67108864
    type: dword
  notify: "Apply the PowerShell/Operational log size with wevtutil"
