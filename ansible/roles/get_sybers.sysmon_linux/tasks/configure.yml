---
- name: "configure | Create /etc/sysmon for the Sysmon-for-Linux config file"
  ansible.builtin.file:
    path: /etc/sysmon
    state: directory
    owner: root
    group: root
    mode: "0755"
- name: "configure | Deploy the baseline Sysmon-for-Linux config"
  ansible.builtin.copy:
    src: sysmon-linux-baseline-config.xml
    dest: /etc/sysmon/config.xml
    owner: root
    group: root
    mode: "0644"
  register: sysmon_linux_config_copy
- name: "configure | Check whether the sysmon process is currently running"
  ansible.builtin.command:
    argv: [pgrep, -x, sysmon]
  register: __sysmon_linux_proc
  changed_when: false
  failed_when: false
- name: "configure | Stop the existing Sysmon service before reapplying config (only when something actually changed)"
  ansible.builtin.command:
    argv: [/usr/bin/sysmon, -u, force]
  when:
    - __sysmon_linux_proc.rc == 0
    - sysmon_linux_install.changed or sysmon_linux_config_copy.changed
  changed_when: true
  failed_when: false
- name: "configure | Install/apply the Sysmon config (registers + starts the sysmon systemd service)"
  ansible.builtin.command:
    argv: [/usr/bin/sysmon, -i, /etc/sysmon/config.xml]
  when: >-
    __sysmon_linux_proc.rc != 0 or sysmon_linux_install.changed or sysmon_linux_config_copy.changed
  changed_when: true
- name: "configure | Ensure the sysmon service is enabled and running"
  ansible.builtin.systemd:
    name: sysmon
    state: started
    enabled: true
  failed_when: false
