---
- name: "join | Range_exchange(join) | read current domain membership"
  ansible.windows.win_shell: (Get-CimInstance -ClassName Win32_ComputerSystem).Domain
  register: __rex_current_domain
  changed_when: false
- name: "join | Range_exchange(join) | leave the child domain first, if joined to it (child DNS still on the NIC)"
  ansible.windows.win_domain_membership:
    workgroup_name: WORKGROUP
    domain_admin_user: Administrator@{{ __rex_orig_child }}
    domain_admin_password: "{{ range_exchange_admin_password }}"
    state: workgroup
  when:
    - __rex_orig_child | lower != __rex_dj.domain | lower
    - __rex_current_domain.stdout | trim | lower == __rex_orig_child | lower
  register: __rex_domainleave
  no_log: true
- name: "join | Range_exchange(join) | reboot if leaving the child domain required it"
  ansible.windows.win_reboot:
    reboot_timeout: 1500
    post_reboot_delay: 100
  when: __rex_domainleave.reboot_required | default(false)
- name: "join | Range_exchange(join) | point primary DNS at the forest-root DC (after the leave, before the join)"
  ansible.windows.win_dns_client:
    adapter_names: "*"
    ipv4_addresses:
      - "{{ __rex_dj.dc_ip }}"
- name: "join | Range_exchange(join) | read current domain before the forest-root join (gate the stale-object cleanup)"
  ansible.windows.win_shell: (Get-CimInstance Win32_ComputerSystem).Domain
  register: __rex_curdom
  changed_when: false
- name: "join | Range_exchange(join) | free the SPN: remove any stale forest-wide computer object (only when not already in the root)"
  when: (__rex_curdom.stdout | trim | lower) != (__rex_dj.domain | lower)
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      Clear-DnsClientCache
      $name = $env:COMPUTERNAME
      $user = 'Administrator@{{ __rex_dj.domain }}'
      $pass = '{{ range_exchange_admin_password }}'
      $gc = New-Object System.DirectoryServices.DirectoryEntry("GC://{{ __rex_dj.dc_ip }}", $user, $pass)
      $searcher = New-Object System.DirectoryServices.DirectorySearcher($gc, "(&(objectClass=computer)(cn=$name))")
      $searcher.PageSize = 100
      $removed = @()
      foreach ($res in $searcher.FindAll()) {
        $dn = [string]$res.Properties['distinguishedname'][0]
        $dom = (($dn -split ',') | Where-Object { $_ -like 'DC=*' } | ForEach-Object { $_.Substring(3) }) -join '.'
        $obj = New-Object System.DirectoryServices.DirectoryEntry("LDAP://$dom/$dn", $user, $pass)
        $obj.DeleteTree()
        $removed += $dn
      }
      if ($removed.Count -gt 0) { $Ansible.Changed = $true; "REMOVED: " + ($removed -join ' | ') }
      else { $Ansible.Changed = $false; "NONE" }
    error_action: stop
  register: __rex_stale_cleanup
  until: __rex_stale_cleanup is succeeded
  retries: 10
  delay: 6
  no_log: true
- name: "join | Range_exchange(join) | join the host to its forest root if not already a member: {{ inventory_hostname ~ ' -> ' ~ __rex_dj.domain }}"
  ansible.windows.win_domain_membership:
    dns_domain_name: "{{ __rex_dj.domain }}"
    domain_admin_user: Administrator@{{ __rex_dj.domain }}
    domain_admin_password: "{{ range_exchange_admin_password }}"
    state: domain
  register: __rex_domainjoin
  until: __rex_domainjoin is succeeded
  retries: 12
  delay: 15
  no_log: true
- name: "join | Range_exchange(join) | reboot if the domain-join required it"
  ansible.windows.win_reboot:
    reboot_timeout: 1500
    post_reboot_delay: 100
  when: __rex_domainjoin.reboot_required
