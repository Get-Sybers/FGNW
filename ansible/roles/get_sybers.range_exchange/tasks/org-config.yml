---
- name: "org-config | Range_exchange(org) | mail-enable every eligible AD group in this forest as a distribution group"
  ansible.windows.win_shell: |
    Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn
    $groups = Get-Group -ResultSize Unlimited |
      Where-Object { $_.RecipientType -eq 'Group' }
    foreach ($g in $groups) {
      try { Enable-DistributionGroup -Identity $g.Name -ErrorAction Stop; Write-Host "mail-enabled: $($g.Name)" }
      catch { Write-Host "skip/err: $($g.Name)" }
    }
  register: __rex_dg_enable
  changed_when: "'mail-enabled:' in (__rex_dg_enable.stdout | default(''))"
  no_log: true
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ __rex_forest_root }}\\Administrator"
    ansible_become_password: "{{ range_exchange_admin_password }}"
- name: "org-config | Range_exchange(org) | create a send connector to each OTHER forest's SMTP domain"
  ansible.windows.win_shell: |
    Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn
    $name = "to-{{ item.value.domain }}"
    if (-not (Get-SendConnector -Identity $name -ErrorAction SilentlyContinue)) {
      New-SendConnector -Name $name -Custom `
        -AddressSpaces "SMTP:{{ item.value.domain }};1" `
        -SmartHosts "{{ item.value.ip }}" `
        -SourceTransportServers $env:COMPUTERNAME
      Write-Output "SEND_CONNECTOR_CREATED"
    } else {
      Write-Output "SEND_CONNECTOR_EXISTS"
    }
  loop: "{{ range_exchange_orgs | dict2items | rejectattr('key', 'equalto', __rex_self) | list }}"
  loop_control:
    label: "{{ __rex_self }} -> {{ item.value.domain }}"
  register: __rex_sendconnector
  changed_when: "'SEND_CONNECTOR_CREATED' in (__rex_sendconnector.stdout | default(''))"
  no_log: true
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ __rex_forest_root }}\\Administrator"
    ansible_become_password: "{{ range_exchange_admin_password }}"
