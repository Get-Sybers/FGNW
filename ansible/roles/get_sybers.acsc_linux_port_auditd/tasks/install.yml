---
- name: "install | Install auditd{{ ' (pinned ' ~ acsc_auditd_package_version ~ ')' if acsc_auditd_package_version else '' }}"
  ansible.builtin.apt:
    name: "auditd{{ '=' ~ acsc_auditd_package_version if acsc_auditd_package_version else '' }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: __acsc_auditd_apt
  retries: 3
  delay: 10
  until: __acsc_auditd_apt is succeeded
- name: "install | Ensure auditd is enabled and running"
  ansible.builtin.systemd_service:
    name: auditd
    enabled: true
    state: started
