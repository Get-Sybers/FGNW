        sha256: 7f14138a9718210b6473d612a4e7088507532b14785e506b3018b8049cd797c1
      - local: tasks/ludus-download-exchange-2019.yml
        upstream: tasks/ludus-download-exchange-2019.yml
        sha256: d486eab6f432b85c108d8491ca64048f350345a12b1df03a07481578aa16c211
      - local: tasks/ludus-exchange-pre.yml
        upstream: tasks/ludus-exchange-pre.yml
        sha256: 9bb6a94f44e6474c045b7b9557e3bd75bca9f57eb3866dde9caa31f60712afc2
      - local: tasks/ludus-exchange-rights.yml
        upstream: tasks/ludus-exchange-rights.yml
        sha256: 14c4806c99e5fcda3cab0e693557bc29cac12f4c77f19d44d8ded25201093e58
      - local: tasks/ludus_sendconnector.yml
        upstream: tasks/ludus_sendconnector.yml
        sha256: 5e7de2914c13d36ac386f507bc0d809f44ad5c6ae570b94b4a06c27b9d9856ba
    derived:
      - local: meta/main.yml
        from: meta/main.yml
        note: >-
          Rewritten to the house namespace (author Get-Sybers, namespace
          get_sybers, role_name range_exchange_install) so Ludus installs the
          role as get_sybers.range_exchange_install. Licence kept GPL-3.0-only.
          No task logic here — this is the only metadata change.
      - local: tasks/ludus-exchange-2019-install.yml
        from: tasks/ludus-exchange-2019-install.yml
        note: >-
          The only change: the three Setup.exe invocations (PrepareSchema,
          PrepareAD, Mode:Install) pass
          /IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF instead of the
          pre-CU12 /IAcceptExchangeServerLicenseTerms, which Exchange 2019 CU12+
          Setup refuses ("add the _DiagnosticDataON or _DiagnosticDataOFF
          parameter"). Diagnostic data is off: an isolated range sends Microsoft
          nothing. Every other byte is upstream's (LF).
      - local: tasks/ludus-exchange-2016-install.yml
        from: tasks/ludus-exchange-2016-install.yml
        note: same three-line switch change as the 2019 file, kept in step.
verify: |
  git clone --depth 1 https://github.com/aleemladha/ludus_exchange /tmp/ludus_exchange
  # verbatim files — identical to upstream once line endings are normalised
  # (meta/main.yml is excluded: it is our namespace rewrite, see derived below)
  for f in README.md defaults/main.yml tasks/main.yml \
           tasks/ludus-create-mailbox.yml tasks/ludus-download-exchange-2016.yml \
           tasks/ludus-download-exchange-2019.yml tasks/ludus-exchange-pre.yml \
           tasks/ludus-exchange-rights.yml tasks/ludus_sendconnector.yml; do
    diff --strip-trailing-cr -q "$f" "/tmp/ludus_exchange/$f" || echo "DIFFERS: $f"
  done
  # patched files — the ONLY difference from upstream is the license switch
  for f in tasks/ludus-exchange-2019-install.yml tasks/ludus-exchange-2016-install.yml; do
    diff --strip-trailing-cr <(sed 's#_DiagnosticDataOFF##' "$f") "/tmp/ludus_exchange/$f" \
      && echo "OK (only the license switch differs): $f"
  done
update: |
  git clone https://github.com/aleemladha/ludus_exchange /tmp/ludus_exchange
  rsync -a --exclude .git /tmp/ludus_exchange/ ./
  find . -type f -exec sed -i 's/\r$//' {} +   # store LF per .gitattributes
  sed -i 's#/IAcceptExchangeServerLicenseTerms /#/IAcceptExchangeServerLicenseTerms_DiagnosticDataOFF /#g' \
    tasks/ludus-exchange-2019-install.yml tasks/ludus-exchange-2016-install.yml
  # then re-record the commit and every sha256 above (LF form)
