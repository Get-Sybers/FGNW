---
schema_version: 1
role: get_sybers.range_exchange_install
baseline: aleemladha/ludus_exchange — Exchange 2016/2019 install for Ludus ranges
status: vendored
derived_from:
  - name: aleemladha/ludus_exchange
    url: https://github.com/aleemladha/ludus_exchange
    commit: 319bb51d9f774e0150468af17ceb7de80576879d
    commit_is: branch-head
    branch: main
    licence: GPL-3.0-only
    licence_holder: aleemladha
    licence_note: >-
      Upstream ships no LICENSE file; the licence is the one its meta/main.yml
      galaxy_info declares (GPLv3). This vendored copy stays GPL-3.0-only — the
      task logic is upstream's GPLv3 code.
    relationship: vendored-verbatim-plus-patch
    note: >-
      Carried in-tree because upstream is unmaintained (no commits since
      2024-10-16, this commit is its HEAD) and Exchange 2019 CU12+ Setup rejects
      the bare /IAcceptExchangeServerLicenseTerms switch it hardcodes; the
      blueprint pinned this exact commit from GitHub before vendoring. The role
      is renamed to the house namespace (get_sybers.range_exchange_install) by
      rewriting meta/main.yml only — Ludus installs it under that name, which
      get_sybers.range_exchange include_role's; every task file is upstream's.
      Upstream ships most files with CRLF line endings; the repo's
      .gitattributes stores them LF, so every sha256 below is of the LF form
      (verify with `diff --strip-trailing-cr`, see the verify block).
    vendored:
      - local: README.md
        upstream: README.md
        sha256: 6640f2b87e74008d41806d3accc5dcd6a8c74fdc4072b3aeac61a0355554e11f
      - local: defaults/main.yml
        upstream: defaults/main.yml
        sha256: edb42dcb114ab4773d1e30a84b7eb53b7f3131a36193ce1e0a1e88e1e064652d
      - local: tasks/main.yml
