---
- name: "Regenerate SSH host keys and restart sshd (clones must not share keys)"
  become: true
  ansible.builtin.raw: >
    rm -f /etc/ssh/ssh_host_* &&
    ssh-keygen -t rsa -f /etc/ssh/ssh_host_rsa_key -N '' &&
    ssh-keygen -t dsa -f /etc/ssh/ssh_host_dsa_key -N '' &&
    (service ssh restart || /etc/init.d/ssh restart)
  changed_when: true

- name: "Clear machine-id if present (harmless no-op on pre-systemd images)"
  become: true
  ansible.builtin.raw: rm -f /etc/machine-id
  register: __metasploitable_machine_id
  changed_when: __metasploitable_machine_id.rc == 0
  failed_when: false

- name: "Best-effort install of qemu-guest-agent (these old package mirrors are usually long dead)"
  become: true
  ansible.builtin.raw: >
    apt-get update >/tmp/apt-update.log 2>&1 &
    pid=$!;
    i=0;
    while kill -0 $pid 2>/dev/null && [ $i -lt 30 ]; do sleep 1; i=$((i+1)); done;
    kill -9 $pid 2>/dev/null;
    apt-get install -y qemu-guest-agent
  register: __metasploitable_guest_agent
  changed_when: __metasploitable_guest_agent.rc == 0
  failed_when: false

- name: "Note whether qemu-guest-agent installed"
  ansible.builtin.debug:
    msg: >-
      {{ 'qemu-guest-agent installed - consider setting agent=1 on the template in Proxmox.'
         if __metasploitable_guest_agent.rc == 0
         else 'qemu-guest-agent could not be installed (expected on this old a distro); leaving agent=0.' }}
