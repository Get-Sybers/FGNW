---
- name: "finalize_convert | Request a graceful ACPI shutdown (belt-and-suspenders)"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/status/shutdown"
    method: POST
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
  failed_when: false
- name: "finalize_convert | Wait for the VM to stop (poll status)"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/status/current"
    method: GET
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
  register: macos_template_stat
  until: macos_template_stat.json.data.status == "stopped"
  retries: 36
  delay: 5
  failed_when: false
- name: "finalize_convert | Force-stop if it did not shut down gracefully"
  when: macos_template_stat.json.data.status | default('') != 'stopped'
  block:
    - name: "finalize_convert | Issue an API stop"
      no_log: true
      ansible.builtin.uri:
        url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/status/stop"
        method: POST
        headers: "{{ macos_template_auth_headers }}"
        validate_certs: "{{ macos_template_validate_certs }}"
    - name: "finalize_convert | Wait for the forced stop"
      no_log: true
      ansible.builtin.uri:
        url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/status/current"
        method: GET
        headers: "{{ macos_template_auth_headers }}"
        validate_certs: "{{ macos_template_validate_certs }}"
      register: macos_template_stat2
      until: macos_template_stat2.json.data.status == "stopped"
      retries: 24
      delay: 5
- name: "finalize_convert | Read the stopped VM's config (disks to detach / move)"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/config"
    method: GET
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
  register: macos_template_final_cfg
- name: "finalize_convert | Detach the Recovery boot disk (sata1) and the install media"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/config"
    method: PUT
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
    body_format: form-urlencoded
    body:
      delete: >-
        {{ ((['sata1'] if macos_template_final_cfg.json.data.sata1 is defined else [])
            + (['ide0', 'ide2'] if (macos_template_oc_embedded | default(false) | bool) else ['ide2'])) | join(',') }}
      boot: "{{ 'order=sata0' if (macos_template_oc_embedded | default(false) | bool) else 'order=ide0;sata0' }}"
- name: "finalize_convert | Re-read the config to find the now-unused Recovery disk volume"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/config"
    method: GET
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
  register: macos_template_final_cfg2
- name: "finalize_convert | Delete the detached Recovery disk (unusedN entries)"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/config"
    method: PUT
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
    body_format: form-urlencoded
    body:
      delete: "{{ macos_template_final_cfg2.json.data | dict2items | selectattr('key', 'match', '^unused[0-9]+$') | map(attribute='key') | join(',') }}"
  when: macos_template_final_cfg2.json.data | dict2items | selectattr('key', 'match', '^unused[0-9]+$') | list | length > 0
- name: "finalize_convert | Remove the staged Recovery boot image from the ISO storage"
  no_log: true
  ansible.builtin.uri:
    url: >-
      {{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/storage/{{ macos_template_iso_storage
      }}/content/{{ macos_template_iso_storage }}:import/{{ macos_template_basesystem_name }}
    method: DELETE
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
    status_code: [200, 400, 404, 500]
  failed_when: false
- name: "finalize_convert | Move the system disk to the template pool if it was installed on local storage"
  when: (macos_template_final_cfg.json.data.sata0 | regex_replace(':.*$', '')) != macos_template_storage_pool
  block:
    - name: "finalize_convert | Start the disk move (sata0 -> {{ macos_template_storage_pool }})"
      no_log: true
      ansible.builtin.uri:
        url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/move_disk"
        method: POST
        headers: "{{ macos_template_auth_headers }}"
        validate_certs: "{{ macos_template_validate_certs }}"
        body_format: form-urlencoded
        body:
          disk: sata0
          storage: "{{ macos_template_storage_pool }}"
          format: "{{ macos_template_storage_format | default(omit, true) }}"
          delete: 1
      register: macos_template_move
    - name: "finalize_convert | Wait for the disk move to finish"
      ansible.builtin.include_tasks: _wait_task.yml
      vars:
        wt_upid: "{{ macos_template_move.json.data }}"
        wt_node: "{{ macos_template_node_target }}"
    - name: "finalize_convert | Move the EFI vars disk alongside it"
      no_log: true
      ansible.builtin.uri:
        url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/move_disk"
        method: POST
        headers: "{{ macos_template_auth_headers }}"
        validate_certs: "{{ macos_template_validate_certs }}"
        body_format: form-urlencoded
        body:
          disk: efidisk0
          storage: "{{ macos_template_storage_pool }}"
          delete: 1
      register: macos_template_move_efi
    - name: "finalize_convert | Wait for the EFI disk move to finish"
      ansible.builtin.include_tasks: _wait_task.yml
      vars:
        wt_upid: "{{ macos_template_move_efi.json.data }}"
        wt_node: "{{ macos_template_node_target }}"
- name: "finalize_convert | Read the config once more (final disk volume ids)"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/config"
    method: GET
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
  register: macos_template_final_cfg3
- name: "finalize_convert | Set the system disk's template-time cache mode (build mode was cache=unsafe)"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/config"
    method: PUT
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
    body_format: form-urlencoded
    body:
      sata0: >-
        {{ macos_template_final_cfg3.json.data.sata0 | regex_replace(',cache=[a-z]+', '') }},cache={{ macos_template_disk_cache_final }}
- name: "finalize_convert | Convert the VM to a Ludus template"
  no_log: true
  ansible.builtin.uri:
    url: "{{ macos_template_api_host }}/api2/json/nodes/{{ macos_template_node_target }}/qemu/{{ macos_template_vmid }}/template"
    method: POST
    headers: "{{ macos_template_auth_headers }}"
    validate_certs: "{{ macos_template_validate_certs }}"
  register: macos_template_tmpl
- name: "finalize_convert | Wait for the template conversion task (if it runs asynchronously)"
  ansible.builtin.include_tasks: _wait_task.yml
  vars:
    wt_upid: "{{ macos_template_tmpl.json.data }}"
    wt_node: "{{ macos_template_node_target }}"
  when: macos_template_tmpl.json.data is string and macos_template_tmpl.json.data.startswith('UPID:')
- name: "finalize_convert | FINALIZE complete"
  ansible.builtin.debug:
    msg: >-
      Done. Template '{{ macos_template_vm_name }}' is VM {{ macos_template_vmid }} on {{ macos_template_node_target }}
      ({{ 'OpenCore embedded on disk; ISOs removed' if (macos_template_oc_embedded | default(false) | bool) else 'OpenCore ISO retained as boot CD' }}).
