---
macos_template_api_host: "{{ lookup('ansible.builtin.env', 'PROXMOX_URL') }}"
macos_template_api_user: "{{ lookup('ansible.builtin.env', 'PVE_TOKEN_USER') or lookup('ansible.builtin.env', 'PROXMOX_USERNAME') }}"
macos_template_api_token_secret: "{{ lookup('ansible.builtin.env', 'PVE_TOKEN_SECRET') }}"
macos_template_api_password: "{{ lookup('ansible.builtin.env', 'PROXMOX_PASSWORD') }}"
macos_template_validate_certs: "{{ not (lookup('ansible.builtin.env', 'PROXMOX_INSECURE') | default('true', true) | bool) }}"
macos_template_node: "{{ lookup('ansible.builtin.env', 'PROXMOX_HOST') }}"
macos_template_storage_pool: "{{ lookup('ansible.builtin.env', 'PROXMOX_STORAGE_POOL') }}"
macos_template_storage_format: "{{ lookup('ansible.builtin.env', 'PROXMOX_STORAGE_FORMAT') }}"
macos_template_pool: "{{ lookup('ansible.builtin.env', 'PROXMOX_POOL') }}"
macos_template_iso_storage: "{{ lookup('ansible.builtin.env', 'ISO_STORAGE_POOL') }}"
macos_template_bridge: "{{ lookup('ansible.builtin.env', 'LUDUS_NAT_INTERFACE') }}"
macos_template_vm_name: "{{ lookup('ansible.builtin.env', 'VM_NAME') }}"
macos_template_description: "{{ lookup('ansible.builtin.env', 'TEMPLATE_DESCRIPTION') }}"
macos_template_iso_url: "{{ lookup('ansible.builtin.env', 'MACOS_ISO_URL') }}"
macos_template_iso_checksum: "{{ lookup('ansible.builtin.env', 'MACOS_ISO_CHECKSUM') }}"
macos_template_iso_name: "{{ lookup('ansible.builtin.env', 'MACOS_ISO_NAME') }}"
macos_template_opencore_url: "{{ lookup('ansible.builtin.env', 'OPENCORE_ISO_URL') }}"
macos_template_opencore_checksum: "{{ lookup('ansible.builtin.env', 'OPENCORE_ISO_CHECKSUM') }}"
macos_template_opencore_name: "{{ lookup('ansible.builtin.env', 'OPENCORE_ISO_NAME') }}"
macos_template_vm_memory: "{{ lookup('ansible.builtin.env', 'VM_MEMORY') | default('8192', true) }}"
macos_template_vm_cores: "{{ lookup('ansible.builtin.env', 'VM_CORES') | default('4', true) }}"
macos_template_vm_disk_size: "{{ lookup('ansible.builtin.env', 'VM_DISK_SIZE') | default('80', true) }}"
macos_template_balloon: "{{ lookup('ansible.builtin.env', 'BALLOON') | default('0', true) }}"
macos_template_guest_cpu: "{{ lookup('ansible.builtin.env', 'GUEST_CPU') | default('Skylake-Client-v4', true) }}"
macos_template_guest_nic_model: "{{ lookup('ansible.builtin.env', 'GUEST_NIC_MODEL') | default('virtio', true) }}"
macos_template_vga: "{{ lookup('ansible.builtin.env', 'VGA') | default('vmware', true) }}"
macos_template_machine: "{{ lookup('ansible.builtin.env', 'MACHINE') | default('q35', true) }}"
macos_template_bios: "{{ lookup('ansible.builtin.env', 'BIOS') | default('ovmf', true) }}"
macos_template_efitype: "{{ lookup('ansible.builtin.env', 'EFI_TYPE') | default('4m', true) }}"
macos_template_qemu_args: "{{ lookup('ansible.builtin.env', 'QEMU_ARGS') | default('', true) }}"
macos_template_ssh_username: "{{ lookup('ansible.builtin.env', 'SSH_USERNAME') | default('localuser', true) }}"
macos_template_ssh_password: "{{ lookup('ansible.builtin.env', 'SSH_PASSWORD') | default('password', true) }}"
macos_template_skip_provision: "{{ lookup('ansible.builtin.env', 'SKIP_PROVISION') | default('false', true) | bool }}"
macos_template_task_timeout: "{{ lookup('ansible.builtin.env', 'TASK_TIMEOUT') | default('7200', true) }}"
macos_template_install_guest_agent: "{{ lookup('ansible.builtin.env', 'INSTALL_GUEST_AGENT') | default('true', true) | bool }}"
macos_template_guest_agent_url: >-
  {{ lookup('ansible.builtin.env', 'GUEST_AGENT_URL')
     | default('https://github.com/mav2287/mac-guest-agent/releases/download/v2.5.6/mac-guest-agent', true) }}
macos_template_guest_agent_checksum: >-
  {{ lookup('ansible.builtin.env', 'GUEST_AGENT_CHECKSUM')
     | default('sha256:fa501be5d8707b92b6b112d359007bb12163d5e95b3931f1fd7307b42afc03aa', true) }}
macos_template_install_clt: "{{ lookup('ansible.builtin.env', 'INSTALL_CLT') | default('true', true) | bool }}"
macos_template_embed_opencore: "{{ lookup('ansible.builtin.env', 'EMBED_OPENCORE') | default('true', true) | bool }}"
