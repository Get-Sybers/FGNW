---
# Ludus-source conventions the house `conform` gate (ci.yml) does not cover:
#   * scripts/ludus_source_lint.py — the template/blueprint/source linter whose
#     rules are derived from the vendored ludus-reference/ facts, plus its
#     self-tests under tests/;
#   * scripts/packer_smoke.sh — `packer fmt -check` + `packer validate` run with
#     the exact Packer plugin set and -var set the Ludus server uses, so a
#     template that validates here validates on a Ludus server.
# The yamllint / ansible-lint / shellcheck / shfmt / actionlint that
# LudusPlusPlus's own CI also runs are already covered by prek + conform in
# ci.yml, so they are not repeated here. `ludus-source-green` is this workflow's
# single required check (see .github/rulesets/main.json); every action is
# hash-pinned (pinact bumps them), matching ci.yml.
name: ludus-source
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test-requirements.txt
      - name: Install the pinned toolchain (test-requirements.txt)
        run: |
          python3 -m pip install --user -r test-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint the source against the Ludus conventions
        run: python3 scripts/ludus_source_lint.py --root . --format github
      - name: Linter self-tests
        run: python3 -m pytest -q tests
  packer-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Packer and the Ludus plugin set (ludus-reference/versions.json)
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
        run: scripts/install_ludus_packer.sh
      - name: packer fmt -check + packer validate (Ludus plugin and variable set)
        run: scripts/packer_smoke.sh --inspect
  ludus-source-green:
    name: ludus-source-green
    if: ${{ always() }}
    needs: [source-lint, packer-smoke]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
