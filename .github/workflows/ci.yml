---
# CI for the Get-Sybers FGNW Ludus source (the cluster collection's docs/03,
# docs/04). Self-contained, mirroring get-sybers/proxmaxxing and get-sybers/lxc
# so the gates stay identical across the repositories; every action is
# hash-pinned (pinact bumps them).
#
# Shape. `lint` runs prek over every file plus the must-have files; `conform`
# runs the one-command house gate (scripts/conform: yamllint, ansible-lint
# --profile production over the source and the Packer templates, a syntax
# check of every play, pin discipline, the static gates and the role
# must-haves) with the pinned collections installed. `all_green` is the one
# required check.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "50 15 * * *"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # The toolchain pins live in test-requirements.txt (docs/04 §6); the hook
  # versions in .pre-commit-config.yaml.
  PREK_PIN: "0.5.5"
jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Must-have files (docs/04)
        run: |
          missing=0
          for f in source.yml requirements.yml test-requirements.txt .ansible-lint .yamllint \
                   .pre-commit-config.yaml Makefile LICENSE README.md CHANGELOG.md SECURITY.md \
                   CONTRIBUTING.md CODE_OF_CONDUCT.md MAINTAINERS AUTHORS doc/index.md \
                   scripts/conform scripts/check-pins.py scripts/gates.yml \
                   blueprints/FGNW/blueprint.yml blueprints/FGNW/range-config.yml \
                   blueprints/FGNW/requirements.yml; do
            if [ ! -e "$f" ]; then echo "::error::missing must-have file: $f"; missing=1; fi
          done
          grep -q '^## \[Unreleased\]' CHANGELOG.md || { echo "::error::CHANGELOG.md has no [Unreleased] section"; missing=1; }
          exit "$missing"
      - name: Cache prek's hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            prek-${{ runner.os }}-
      - name: Install prek
        run: |
          python3 -m pip install --user "prek==$PREK_PIN"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: prek (all hooks, all files)
        # no-commit-to-branch guards developers against committing to main locally;
        # on the push-to-main run HEAD *is* main. ansible-lint runs once, in the
        # `conform` job, where the pinned collections are installed for it.
        env:
          SKIP: no-commit-to-branch,ansible-lint
        run: prek run --all-files --show-diff-on-failure
  conform:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: test-requirements.txt
      - name: Install the pinned toolchain (test-requirements.txt)
        run: |
          python3 -m pip install --user -r test-requirements.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache the pinned collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
      - name: Install pinned collections (requirements.yml)
        run: ansible-galaxy collection install -r requirements.yml
      - name: The house gate (scripts/conform)
        run: ./scripts/conform
  all_green:
    name: all_green
    if: ${{ always() }}
    needs: [lint, conform]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
