collections:
  - name: ansible.utils
    version: "5.1.2"
  - name: community.general
    version: "10.3.0"
  - name: ansible.windows
    version: "2.8.0"
  - name: community.windows
    version: "2.4.0"
  - name: chocolatey.chocolatey
    version: "1.5.3"
  - name: microsoft.ad
    version: "1.8.0"
  - name: ansible.mysql
    version: "5.2.0"
  - name: badsectorlabs.ludus_windows_utils
    version: "1.2.0"
  # The blueprint's macOS plays (FGNW-mac-dev.yml) apply geerlingguy.mac.homebrew,
  # .mas and .dock; pinned here, as in blueprints/FGNW/requirements.yml, so the
  # lint and syntax check of those plays resolve the roles.
  - name: geerlingguy.mac
    version: "1.2.0"
  # Phase 1b of the FGNW blueprint runs get_sybers.lxc's deploy_ghost9_range play by its
  # collection-qualified name; the collection and its community.proxmox dependency are
  # installed for the lint and syntax checks. get_sybers.lxc 0.1.0 has no collection release
  # tag yet, so it is pinned as a git source at a commit (scripts/check-pins.py accepts a
  # `type: git` entry pinned to a 40-hex commit as an exact pin); re-pin to the release
  # tag once one exists.
  - name: https://github.com/Get-Sybers/LXC.git
    type: git
    version: 586a99197b06727e12f651b34956f56b6aab3d91
  - name: community.proxmox
    version: "2.1.0"
