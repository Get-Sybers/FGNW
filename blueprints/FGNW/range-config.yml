---
defaults:
  target_node: pi-01
  snapshot_with_RAM: true
  stale_hours: 0
  ad_domain_functional_level: Win2012R2
  ad_forest_functional_level: Win2012R2
  ad_domain_admin: domainadmin
  ad_domain_admin_password: password
  ad_domain_user: domainuser
  ad_domain_user_password: password
  ad_domain_safe_mode_password: password
  timezone: America/New_York
  enable_dynamic_wallpaper: true
global_role_vars:
  ghosts_config_replace: '  "ApiRootUrl": "http://10.{{ range_second_octet }}.99.51:5000/api",'
ludus:
  - vm_name: "{{ range_id }}-fire-dc1"
    force_ip: true
    target_node: pi-01
    hostname: "{{ range_id }}-fire-dc1"
    template: win2022-server-x64-appxfix-template
    vlan: 10
    ip_last_octet: 15
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: true
      gpos: [disable_defender]
    domain:
      fqdn: fire.ninja
      role: primary-dc
    testing:
      snapshot: true
      block_internet: true
    role_vars:
      ludus_trust_partner_domain: otogakure.ninja
      ludus_trust_partner_dc_ip: 10.{{ range_second_octet }}.30.10
      ludus_dns_forward_zone: otogakure.ninja
      ludus_dns_forward_server: 10.{{ range_second_octet }}.30.10
      ludus_enable_sid_history: true
      ludus_cross_domain_group_members: []
      domain: fire.ninja
    roles:
      - name: badsectorlabs.ludus_windows_utils.ludus_ad_forest_trust
        depends_on:
          - vm_name: "{{ range_id }}-konoha-dc1"
            role: badsectorlabs.ludus_windows_utils.ludus_child_domain
      - name: get_sybers.range_password_policy
      - name: get_sybers.range_ad_mgmt
      - name: get_sybers.sysmon
      - name: get_sybers.acsc_event_logging
