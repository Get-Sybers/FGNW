---
dependencies: []
galaxy_info:
  role_name: fgnw_thunderbird
  namespace: fgnw
  author: Get-Sybers
  description: >-
    Install and preconfigure the Mozilla Thunderbird mail client on an FGNW range
    workstation. Unified Win+Mac role dispatching on ansible_os_family. Installs
    via Chocolatey (Windows) or expects a pre-staged Homebrew cask (macOS), then
    drops an enterprise policies.json that configures the account against the
    village's mail server (Exchange via IMAP/SMTP for Konoha / Sound / Akatsuki,
    Postfix+Dovecot for Hidden Sand). Caller passes per-host persona + mail-server
    vars; the role has no identity defaults that would silently point hosts at the
    wrong server.
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: Windows
      versions:
        - all
    - name: MacOSX
      versions:
        - all
  galaxy_tags:
    - fgnw
    - thunderbird
    - mail
    - windows
    - macos
collections:
  - ansible.builtin
  - ansible.windows
  - chocolatey.chocolatey
