---
dependencies: []
galaxy_info:
  role_name: fgnw_thunderbird
  namespace: get_sybers
  author: Get-Sybers
  description: >-
    Install and preconfigure the Mozilla Thunderbird mail client on an FGNW range
    workstation. Unified Win+Mac role dispatching on ansible_facts['os_family']. Installs
    from the installer cached on the range Nexus (the Windows .exe or the macOS .dmg,
    sha512-pinned, cached in Phase 0 because containment blocks Mozilla's CDN), then
    drops an enterprise policies.json that configures the account against the
    village's mail server (Exchange via IMAP/SMTP for Konoha / Sound / Akatsuki,
    Postfix+Dovecot for Hidden Sand). Caller passes per-host persona + mail-server
    vars; the role has no identity defaults that would silently point hosts at the
    wrong server.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Windows
      versions:
        - all
    - name: MacOSX
      versions:
        - all
  galaxy_tags:
    - fgnw
    - thunderbird
    - mail
    - windows
    - macos
collections:
  - ansible.builtin
  - ansible.windows
