---
# Unified Thunderbird client role for the FGNW range. Dispatches on `ansible_facts['os_family']` so
# both the Windows workstations (konoha-ws1..5, oto-ws1, akatsuki-ws1/2 — Thunderbird talks
# IMAP+SMTP to their village's Exchange server) and the Sand macOS workstation (suna-ws1 —
# talks to the Sand Postfix/Dovecot stack) run the same account preconfiguration code path.
#
# Install vs. configure:
#   * Both paths install Thunderbird from the installer cached on the range Nexus (raw-hosted)
#     by nexus-cache-thunderbird.yml in Phase 0 — the Windows .exe or the macOS .dmg, pinned by
#     version + Mozilla's sha512 — because Phase 2 containment seals internet egress and neither
#     Chocolatey's `thunderbird` package (a stub that downloads from download.mozilla.org at
#     install time) nor a Homebrew cask can fetch the installer from inside the range.
#   * Both then drop the enterprise policies.json; the configure step is identical.
#
# The policies.json template is OS-agnostic — it's Mozilla's enterprise policy schema and
# reads the same vars under both branches.
- name: Fail loudly on an unsupported OS family (checked before dispatch so the message is reachable)
  ansible.builtin.fail:
    msg: >-
      fgnw_thunderbird supports ansible_facts['os_family'] in (Windows, Darwin) only.
      Got '{{ ansible_facts['os_family'] }}' on '{{ inventory_hostname }}'. If you need Linux
      Thunderbird too, add tasks/linux.yml and extend the dispatcher below.
  when: ansible_facts['os_family'] not in ['Windows', 'Darwin']

- name: Dispatch to the OS-specific install + configure path
  ansible.builtin.include_tasks:
    file: "{{ 'windows' if ansible_facts['os_family'] == 'Windows' else 'macos' }}.yml"
  when: ansible_facts['os_family'] in ['Windows', 'Darwin']
