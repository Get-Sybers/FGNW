---
# Windows branch: install Thunderbird from the installer cached on the range Nexus
# (raw-hosted), then drop the enterprise policies.json alongside the install. Thunderbird
# reads `C:\Program Files\Mozilla Thunderbird\distribution\policies.json` at launch (same
# mechanism Firefox uses for its enterprise policies).
#
# Not Chocolatey: the community `thunderbird` package is a stub whose install script downloads
# the installer from download.mozilla.org at install time, and Nexus's chocolatey-proxy mirrors
# only the package metadata, never that download — inside Phase 2 containment the install
# fails. The installer is cached on Nexus by nexus-cache-thunderbird.yml (Phase 0) and pinned
# here by version + Mozilla's sha512.
- name: "windows | Read the installed Thunderbird version (empty when absent)"
  ansible.windows.win_shell: |
    $exe = Join-Path '{{ fgnw_thunderbird_win_install_dir }}' 'thunderbird.exe'
    if (Test-Path -LiteralPath $exe) { (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion } else { '' }
  register: __fgnw_thunderbird_installed
  changed_when: false

- name: "windows | Decide whether to install: absent, or not version {{ fgnw_thunderbird_version }}"
  ansible.builtin.set_fact:
    __fgnw_thunderbird_install: >-
      {{ not ((__fgnw_thunderbird_installed.stdout | trim) == (fgnw_thunderbird_version | string)
              or (__fgnw_thunderbird_installed.stdout | trim).startswith((fgnw_thunderbird_version | string) ~ '.')) }}
    __fgnw_thunderbird_installer_path: "{{ fgnw_thunderbird_win_staging_dir }}\\{{ fgnw_thunderbird_win_installer }}"

- name: "windows | Install Thunderbird from Nexus, version {{ fgnw_thunderbird_version }}"
  when: __fgnw_thunderbird_install | bool
  block:
    - name: "windows | Ensure the staging directory exists"
      ansible.windows.win_file:
        path: "{{ fgnw_thunderbird_win_staging_dir }}"
        state: directory

    - name: "windows | Fetch the installer from Nexus (sha512-pinned)"
      ansible.windows.win_get_url:
        url: "{{ fgnw_thunderbird_nexus_tools_url }}/{{ fgnw_thunderbird_win_installer }}"
        dest: "{{ __fgnw_thunderbird_installer_path }}"
        checksum: "{{ fgnw_thunderbird_win_sha512 }}"
        checksum_algorithm: sha512
        force: true

    - name: "windows | Run the Mozilla installer silently"
      ansible.windows.win_command:
        argv: "{{ [__fgnw_thunderbird_installer_path] + (fgnw_thunderbird_win_install_args | split) }}"
      changed_when: true

  always:
    - name: "windows | Remove the staging directory"
      ansible.windows.win_file:
        path: "{{ fgnw_thunderbird_win_staging_dir }}"
        state: absent

- name: "windows | Verify the installed Thunderbird is version {{ fgnw_thunderbird_version }}"
  ansible.windows.win_shell: |
    $exe = Join-Path '{{ fgnw_thunderbird_win_install_dir }}' 'thunderbird.exe'
    if (Test-Path -LiteralPath $exe) { (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion } else { '' }
  register: __fgnw_thunderbird_verify
  changed_when: false
  retries: 12
  delay: 5
  until: >-
    (__fgnw_thunderbird_verify.stdout | trim) == (fgnw_thunderbird_version | string)
    or (__fgnw_thunderbird_verify.stdout | trim).startswith((fgnw_thunderbird_version | string) ~ '.')

- name: "windows | Ensure the Thunderbird enterprise policies dir exists"
  ansible.windows.win_file:
    path: "{{ fgnw_thunderbird_win_distribution_dir }}"
    state: directory

- name: "windows | Install the Thunderbird policies.json (account preconfiguration)"
  ansible.windows.win_copy:
    dest: "{{ fgnw_thunderbird_win_distribution_dir }}\\policies.json"
    content: "{{ lookup('template', 'policies.json.j2') }}"
