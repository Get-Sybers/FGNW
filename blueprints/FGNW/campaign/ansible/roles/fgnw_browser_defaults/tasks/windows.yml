---
# Windows (Edge + IE) half of fgnw_browser_defaults. Consumes fgnw_browser_defaults_homepage and
# fgnw_browser_defaults_bookmark_list set by tasks/main.yml. Logic is unchanged from before the OS merge —
# this file only moved out of tasks/main.yml.
- name: 'windows | Set default Internet Explorer/Edge legacy start page for new profiles (HKU\.DEFAULT)'
  ansible.windows.win_regedit:
    path: HKU:\.DEFAULT\Software\Microsoft\Internet Explorer\Main
    name: Start Page
    data: "{{ fgnw_browser_defaults_homepage }}"
    type: string
- name: "windows | Set Edge homepage (machine policy, applies immediately to existing profiles)"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Edge
    name: HomepageLocation
    data: "{{ fgnw_browser_defaults_homepage }}"
    type: string
- name: "windows | Ensure Edge uses the homepage rather than the New Tab Page"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Edge
    name: HomepageIsNewTabPage
    data: 0
    type: dword
- name: "windows | Configure Edge to reopen the village homepage on every launch"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Edge
    name: RestoreOnStartup
    data: 4
    type: dword
- name: "windows | Set the startup URL list"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Edge\RestoreOnStartupURLs
    name: "1"
    data: "{{ fgnw_browser_defaults_homepage }}"
    type: string
- name: "windows | Show the Edge bookmarks bar"
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Edge
    name: BookmarkBarEnabled
    data: 1
    type: dword
- name: "windows | Create bookmarks directory"
  ansible.windows.win_file:
    path: C:\Users\Public\Desktop\Bookmarks
    state: directory
- name: "windows | Deploy village bookmarks file (Netscape bookmark format, Firefox/Chrome importable)"
  ansible.windows.win_copy:
    dest: C:\Users\Public\Desktop\Bookmarks\{{ fgnw_browser_defaults_village }}-bookmarks.html
    content: |
      <!DOCTYPE NETSCAPE-Bookmark-file-1>
      <META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
      <TITLE>Bookmarks</TITLE>
      <H1>{{ fgnw_browser_defaults_village }}</H1>
      <DL><p>
      {% for b in fgnw_browser_defaults_bookmark_list %}
          <DT><A HREF="http://{{ b.url }}">{{ b.title }}</A>
      {% endfor %}
      </DL><p>
