---
# OS-dispatching decoy-files role: plants the per-village decoy document corpus. Loads the
# shared village-folders.yml once, computes the file list fact (fgnw_decoy_files_list) and the authored
# content directory the OS-specific task files consume, then branches on ansible_os_family.
# Keeping both OSes in one role is the same anti-divergence pattern as fgnw_browser_defaults.
#
# Caller contract (same shape for both OSes):
#   fgnw_decoy_files_village     (required) — key into content/filesystem/village-folders.yml AND
#                                 into content/filesystem/documents/<village>/
#   fgnw_decoy_files_root  (required) — platform-correct destination:
#                                   Windows: C:\Shares\Documents
#                                   macOS:   /Users/Shared/Documents
#
# OS mechanisms this dispatches to:
#   Windows (ansible_os_family == Windows) -> tasks/windows.yml (win_file + win_copy)
#   macOS   (ansible_os_family == Darwin)  -> tasks/macos.yml   (file + copy, become: true)
- name: Load village document list (shared corpus)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../content/filesystem/village-folders.yml"
    name: fgnw_decoy_files_village_documents

- name: Fail if the requested village has no document list
  ansible.builtin.fail:
    msg: No entry for '{{ fgnw_decoy_files_village }}' in content/filesystem/village-folders.yml
  when: fgnw_decoy_files_village not in fgnw_decoy_files_village_documents.village_documents

- name: Set the file list for this village
  ansible.builtin.set_fact:
    fgnw_decoy_files_list: "{{ fgnw_decoy_files_village_documents.village_documents[fgnw_decoy_files_village] }}"

- name: Plant decoys on Windows (win_file + win_copy)
  ansible.builtin.include_tasks: windows.yml
  when: ansible_os_family == 'Windows'

- name: Plant decoys on macOS (file + copy, become)
  ansible.builtin.include_tasks: macos.yml
  when: ansible_os_family == 'Darwin'

- name: Fail loudly on an unsupported OS family (nothing matched)
  ansible.builtin.fail:
    msg: >-
      fgnw_decoy_files has no implementation for ansible_os_family=
      '{{ ansible_os_family | default('(unset — did gather_facts run?)') }}'.
      Only Windows and Darwin are supported.
  when: ansible_os_family not in ['Windows', 'Darwin']
