---
# Stand up the Sand mail server on suna-mail: Dovecot (IMAP/LMTP, built from the Nexus source) +
# Postfix (SMTP, stock binary run from a writable alt config dir because /etc/postfix is SIP-locked).
# Mailboxes are VIRTUAL (a passwd-file of the Sand AD users with their AD passwords, delivered to
# Maildirs under a dedicated mail user). Idempotent: the slow source build is guarded by `creates`,
# and a re-run only rewrites config and reloads the services. See the role defaults for the why.

# --- Mailbox user list (AD domain users ∩ inbox corpus, with their AD passwords) ---------------
- name: Load the shared OWA inbox corpus
  ansible.builtin.include_vars:
    file: "{{ fgnw_mac_mail_server_user_corpus_file }}"
    name: fgnw_mac_mail_server_inbox_data

- name: Load the AD config (domain membership + per-user passwords)
  ansible.builtin.include_vars:
    file: "{{ fgnw_mac_mail_server_ad_config_file }}"
    name: fgnw_mac_mail_server_ad_config
  no_log: true

- name: Build the Sand mailbox list (local part + AD password) for every corpus user in this domain
  ansible.builtin.set_fact:
    fgnw_mac_mail_server_mailbox_users: >-
      {{ fgnw_mac_mail_server_mailbox_users | default([])
         + [{'name': item.key, 'password': item.value.password}] }}
  loop: >-
    {{ (fgnw_mac_mail_server_ad_config.lab.domains[fgnw_mac_mail_server_domain].users | default({}))
       | dict2items
       | selectattr('key', 'in', (fgnw_mac_mail_server_inbox_data.user_inboxes | default({})).keys() | list)
       | list }}
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Assert this host has at least one Sand mailbox user to serve
  ansible.builtin.assert:
    that: (fgnw_mac_mail_server_mailbox_users | default([])) | length > 0
    fail_msg: >-
      No seedable Sand mailboxes for {{ inventory_hostname }}: no key in content/OWA/user-inboxes.yml
      matches a user of domain '{{ fgnw_mac_mail_server_domain }}' in ad/NARUTO/data/config.json.
    quiet: true

# --- Dovecot service accounts (macOS has no dovecot/dovenull; mailboxes are virtual) -----------
- name: Create the Dovecot service groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
  loop:
    - { name: "{{ fgnw_mac_mail_server_mail_user }}", gid: "{{ fgnw_mac_mail_server_mail_uid }}" }
    - { name: "{{ fgnw_mac_mail_server_login_user }}", gid: "{{ fgnw_mac_mail_server_login_uid }}" }
    - { name: "{{ fgnw_mac_mail_server_dovecot_group }}", gid: "{{ fgnw_mac_mail_server_dovecot_gid }}" }
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Create the Dovecot service users (nologin, no home; distinct mail and login accounts)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    shell: /usr/bin/false
    home: /var/empty
    create_home: false
  loop:
    - { name: "{{ fgnw_mac_mail_server_mail_user }}", uid: "{{ fgnw_mac_mail_server_mail_uid }}" }
    - { name: "{{ fgnw_mac_mail_server_login_user }}", uid: "{{ fgnw_mac_mail_server_login_uid }}" }
  loop_control:
    label: "{{ item.name }}"
  become: true

# --- Directories (after the users exist, so vmail can be owned by the mail user) ---------------
- name: Create the Dovecot install, source, vmail, and Postfix alt-config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('wheel') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ fgnw_mac_mail_server_dovecot_prefix }}" }
    - { path: "{{ fgnw_mac_mail_server_dovecot_prefix }}/.src", mode: "0700" }
    - path: "{{ fgnw_mac_mail_server_vmail_dir }}"
      owner: "{{ fgnw_mac_mail_server_mail_user }}"
      group: "{{ fgnw_mac_mail_server_mail_user }}"
      mode: "0700"
    - { path: "{{ fgnw_mac_mail_server_postfix_dir }}" }
  loop_control:
    label: "{{ item.path }}"
  become: true

# --- Build Dovecot from the Nexus source ------------------------------------------------------
- name: Fetch the Dovecot source from the range Nexus (sha256-pinned)
  ansible.builtin.get_url:
    url: "{{ fgnw_mac_mail_server_nexus_tools_url }}/{{ fgnw_mac_mail_server_dovecot_tarball }}"
    dest: "{{ fgnw_mac_mail_server_dovecot_prefix }}/.src/{{ fgnw_mac_mail_server_dovecot_tarball }}"
    checksum: "sha256:{{ fgnw_mac_mail_server_dovecot_sha256 }}"
    mode: "0644"
  become: true

- name: Build Dovecot from source with the Command Line Tools clang (only when the binary is absent)
  ansible.builtin.shell: |
    set -euo pipefail
    cd '{{ fgnw_mac_mail_server_dovecot_prefix }}/.src'
    rm -rf 'dovecot-{{ fgnw_mac_mail_server_dovecot_version }}'
    /usr/bin/tar xzf '{{ fgnw_mac_mail_server_dovecot_tarball }}'
    cd 'dovecot-{{ fgnw_mac_mail_server_dovecot_version }}'
    ./configure --prefix='{{ fgnw_mac_mail_server_dovecot_prefix }}' \
      --with-ssl=no --without-pam --without-lucene --without-sqlite --without-mysql --without-pgsql \
      CPPFLAGS='-Dst_atim=st_atimespec -Dst_ctim=st_ctimespec -Dst_mtim=st_mtimespec'
    make -j"$(sysctl -n hw.ncpu)"
    make install
  args:
    executable: /bin/bash
    creates: "{{ fgnw_mac_mail_server_dovecot_prefix }}/sbin/dovecot"
  become: true

# --- Dovecot config + virtual-user passwd-file ------------------------------------------------
- name: Install the Dovecot config
  ansible.builtin.template:
    src: dovecot.conf.j2
    dest: "{{ fgnw_mac_mail_server_dovecot_prefix }}/dovecot.conf"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: Restart dovecot

- name: Install the Dovecot virtual-user passwd-file (readable by the auth worker)
  ansible.builtin.template:
    src: dovecot-users.j2
    dest: "{{ fgnw_mac_mail_server_dovecot_prefix }}/dovecot-users"
    owner: root
    group: "{{ fgnw_mac_mail_server_mail_user }}"
    mode: "0640"
  no_log: true
  become: true
  notify: Restart dovecot

# --- Postfix config in the writable alt directory (SIP-locked /etc/postfix) --------------------
- name: Copy the stock Postfix master.cf into the writable alt config dir
  ansible.builtin.copy:
    src: /etc/postfix/master.cf
    dest: "{{ fgnw_mac_mail_server_postfix_dir }}/master.cf"
    remote_src: true
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: Restart postfix

- name: Install the Postfix main.cf (alt config dir)
  ansible.builtin.template:
    src: postfix-main.cf.j2
    dest: "{{ fgnw_mac_mail_server_postfix_dir }}/main.cf"
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: Restart postfix

- name: Stop the stock loopback Postfix (best-effort) so the alt-config instance owns port 25
  ansible.builtin.command:
    argv: [postfix, stop]
  changed_when: false
  failed_when: false
  become: true

- name: Disable the stock Postfix LaunchDaemon (best-effort)
  ansible.builtin.command:
    argv: [launchctl, "{{ item }}", system/com.apple.postfix.master]
  loop: [bootout, disable]
  changed_when: false
  failed_when: false
  become: true

# --- LaunchDaemons (keep both services up across reboots) -------------------------------------
- name: Install the Dovecot and Postfix LaunchDaemon plists
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/Library/LaunchDaemons/{{ item.label }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  loop:
    - { src: com.fgnw.dovecot.plist.j2, label: "{{ fgnw_mac_mail_server_dovecot_label }}" }
    - { src: com.fgnw.postfix.plist.j2, label: "{{ fgnw_mac_mail_server_postfix_label }}" }
  loop_control:
    label: "{{ item.label }}"
  become: true
  notify:
    - Restart dovecot
    - Restart postfix

- name: Check which mail LaunchDaemons are already loaded
  ansible.builtin.command:
    argv: [launchctl, print, "system/{{ item }}"]
  loop:
    - "{{ fgnw_mac_mail_server_dovecot_label }}"
    - "{{ fgnw_mac_mail_server_postfix_label }}"
  register: fgnw_mac_mail_server_loaded
  changed_when: false
  failed_when: false
  become: true

- name: Bootstrap the mail LaunchDaemons that are not loaded yet
  ansible.builtin.command:
    argv: [launchctl, bootstrap, system, "/Library/LaunchDaemons/{{ item.item }}.plist"]
  loop: "{{ fgnw_mac_mail_server_loaded.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true
  become: true
