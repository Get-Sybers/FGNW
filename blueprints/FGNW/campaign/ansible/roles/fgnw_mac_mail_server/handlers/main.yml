---
# Reload a service after a config or plist change. community.general.launchd's `restarted` state
# unloads then loads the job (so a changed plist is picked up) and starts it — the official-module
# replacement for a hand-rolled `launchctl bootout`/`bootstrap`. On macOS 15 the module's legacy
# `launchctl unload`/`load` is synchronous enough to avoid the bootout/bootstrap reload race, so no
# wait loop is needed (verified on-range against both daemons). `name` resolves `<name>.plist` under
# /Library/LaunchDaemons, where the role installs them.
- name: Restart dovecot
  community.general.launchd:
    name: "{{ fgnw_mac_mail_server_dovecot_label }}"
    state: restarted
  become: true

- name: Restart postfix
  community.general.launchd:
    name: "{{ fgnw_mac_mail_server_postfix_label }}"
    state: restarted
  become: true
