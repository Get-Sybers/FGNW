---
dependencies: []
galaxy_info:
  role_name: powershell_logging
  namespace: get_sybers
  author: Get-Sybers
  description: >-
    Enable the three PowerShell audit policies the FGNW blue-team detection lab
    depends on -- script block logging, module logging and over-the-shoulder
    transcription -- by writing the corresponding Group Policy values under
    HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell with
    ansible.windows.win_regedit. Each stream is independently gated by a toggle, and
    the registry values are the functional contract.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Windows
      versions:
        - "2019"
        - "2022"
  galaxy_tags:
    - fgnw
    - powershell
    - logging
    - detection
    - windows
collections:
  - ansible.windows
