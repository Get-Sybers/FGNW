---
- name: Toggle script block logging policy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
    name: EnableScriptBlockLogging
    data: "{{ powershell_logging_script_block_enabled | int }}"
    type: dword
    state: present
  when: powershell_logging_script_block_enabled | default(true)
- name: Toggle module logging policy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging
    name: EnableModuleLogging
    data: "{{ powershell_logging_module_enabled | int }}"
    type: dword
    state: present
  when: powershell_logging_module_enabled | default(true)
- name: Select which modules module logging covers
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames
    name: "*"
    data: "{{ powershell_logging_module_names }}"
    type: string
    state: present
  when: powershell_logging_module_enabled | default(true)
- name: Toggle over-the-shoulder transcription policy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
    name: EnableTranscripting
    data: "{{ powershell_logging_transcription_enabled | int }}"
    type: dword
    state: present
  when: powershell_logging_transcription_enabled | default(true)
- name: Point transcription at its output directory
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
    name: OutputDirectory
    data: "{{ powershell_logging_transcription_output_directory }}"
    type: string
    state: present
  when: powershell_logging_transcription_enabled | default(true)
- name: Stamp invocation headers into each transcript
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription
    name: EnableInvocationHeader
    data: "{{ powershell_logging_invocation_header_enabled | int }}"
    type: dword
    state: present
  when: powershell_logging_transcription_enabled | default(true)
