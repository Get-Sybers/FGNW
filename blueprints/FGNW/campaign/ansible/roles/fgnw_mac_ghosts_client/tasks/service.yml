---
# Run the GHOSTS Universal client as a LaunchAgent in the GUI console user's Aqua session, so the
# BrowserChrome handler drives a VISIBLE Chrome (the macOS parallel to the Windows autologon
# desktop). Previously this was a root LaunchDaemon running a non-existent "ghosts" binary.
- name: "service | Write the ghosts LaunchAgent plist (runs in the GUI session)"
  ansible.builtin.copy:
    dest: "/Library/LaunchAgents/{{ fgnw_mac_ghosts_client_daemon_label }}.plist"
    owner: root
    group: wheel
    mode: "0644"
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>Label</key><string>{{ fgnw_mac_ghosts_client_daemon_label }}</string>
        <key>ProgramArguments</key>
        <array><string>{{ fgnw_mac_ghosts_client_install_dir }}/{{ fgnw_mac_ghosts_client_binary }}</string></array>
        <key>WorkingDirectory</key><string>{{ fgnw_mac_ghosts_client_install_dir }}</string>
        <key>RunAtLoad</key><true/>
        <key>KeepAlive</key><true/>
        <key>StandardOutPath</key><string>{{ fgnw_mac_ghosts_client_log_dir }}/stdout.log</string>
        <key>StandardErrorPath</key><string>{{ fgnw_mac_ghosts_client_log_dir }}/stderr.log</string>
      </dict>
      </plist>
  become: true

- name: "service | Bootstrap the LaunchAgent into the run-user's GUI session"
  ansible.builtin.shell: |
    uid=$(id -u '{{ fgnw_mac_ghosts_client_run_user }}')
    launchctl bootout "gui/$uid/{{ fgnw_mac_ghosts_client_daemon_label }}" 2>/dev/null || true
    launchctl bootstrap "gui/$uid" "/Library/LaunchAgents/{{ fgnw_mac_ghosts_client_daemon_label }}.plist"
  args:
    executable: /bin/bash
  register: __fgnw_mac_ghosts_client_bootstrap
  changed_when: __fgnw_mac_ghosts_client_bootstrap.rc == 0
  failed_when: >-
    __fgnw_mac_ghosts_client_bootstrap.rc != 0
    and 'already' not in (__fgnw_mac_ghosts_client_bootstrap.stderr | default(''))
  become: true
