---
dependencies: []
galaxy_info:
  role_name: ad_wait_ready
  namespace: get_sybers
  author: Get-Sybers
  description: >-
    Reusable Active Directory readiness gate. Waits until the directory on a Windows
    domain controller is serving again after a promotion or a reboot: the NTDS, DNS and
    Netlogon services run and Get-ADDomain answers (which needs AD Web Services), and
    optionally the host's own DC identity, the kdc service and the SYSVOL/NETLOGON shares
    are there too. Read-only; replaces ad-hoc per-role post-reboot waits. Original work
    of Get-Sybers.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Windows
      versions:
        - "2019"
        - "2022"
  galaxy_tags:
    - activedirectory
    - windows
collections:
  - ansible.builtin
