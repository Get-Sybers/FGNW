---
dependencies: []
galaxy_info:
  role_name: dnsforwarder
  namespace: get_sybers
  author: Get-Sybers
  description: >-
    Cross-village name resolution for the range's Windows domain controllers. On every DC
    it publishes a DNS conditional forwarder for each other AD domain of the range whose
    DC is in the inventory, pointing at that DC's address, and registers the forest's
    mail A record when the forest's mail server answers on its VLAN. Original work of
    Get-Sybers.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Windows
      versions:
        - "2019"
        - "2022"
  galaxy_tags:
    - dns
    - activedirectory
    - windows
collections:
  - ansible.builtin
  - ansible.windows
