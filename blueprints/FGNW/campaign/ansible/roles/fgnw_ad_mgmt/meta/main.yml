---
galaxy_info:
  author: Get-Sybers
  description: >
    Directory realizer for the FGNW owned AD-build layer. Reads the config.json contract for a
    domain — domains[*].{organisation_units, groups, users} — and realizes it: creates the OUs,
    the groups (per scope), the users (with their group memberships), and the declared group
    membership. Rule 8 (one task, one action) throughout, driven by microsoft.ad.* module
    semantics. The playbook (ad-data.yml) decides this runs on the domain controllers and
    supplies ad_ou / ad_groups / ad_users from the contract; this role only groups and acts.
    Original work of Get-Sybers.
  license: MIT
  min_ansible_version: "2.12"
  platforms:
    - name: Windows
      versions:
        - "2019"
        - "2022"
dependencies: []
