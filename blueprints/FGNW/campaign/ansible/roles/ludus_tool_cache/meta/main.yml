---
dependencies: []
galaxy_info:
  role_name: ludus_tool_cache
  namespace: get_sybers
  author: Get-Sybers
  description: >-
    Generic Linux tool-cache web server. Installs nginx (distro package), serves a
    static tool-download index page, and fetches listed tool binaries so a contained
    range can stage operator tooling. All page content and tool metadata is supplied
    through variables, so the role carries no blueprint-specific references and suits
    any Ludus range that needs an operator staging server. On a contained range it
    routes apt through the Nexus Debian proxy and disables the internet apt sources.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
  galaxy_tags:
    - ludus
    - nginx
    - web
    - tools
    - linux
collections:
  - ansible.builtin
