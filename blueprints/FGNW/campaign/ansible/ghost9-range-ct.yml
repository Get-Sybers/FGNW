---
# Phase 1b — the GHOSTS server of one Ludus range, as a get_sybers.lxc container.
#
# The CT is created from the ghost9 LXC template the LXC repository publishes
# (ghcr.io/get-sybers/lxc/ghost9: Debian 13, GHOSTS 9.3.0 / API v9, n8n and
# Grafana as native systemd services) through the get_sybers.lxc roles:
#   play 1  localhost   FGNW's own range preflight (VNet, bridge, MTU, no
#                       `*-ghosts` VM), lxc_preflight (root, PVE node, pct), then
#                       lxc_ghost9 `container` (lxc_guest pulls the OCI image into
#                       local:vztmpl/ghost9.tar, creates and starts the CT, adds it
#                       to the `ghost9_ct` group), then a placement postcheck.
#   play 2  ghost9_ct   lxc_guest `baseline` inside the CT (over proxmox_pct_remote).
#   play 3  ghost9_ct   lxc_ghost9 `server`: firewall, PostgreSQL role/db, site
#                       config for the range address, n8n provisioning, start, verify.
#   play 4  localhost   `-t destroy -e lxc_guest_confirm_destroy=true`: lxc_ghost9 `remove`.
#
# Invocation (deploy-tasks/phase1b-ghost9.yml writes the 0600 extra-vars file and
# runs this as root on the PVE node that hosts the Ludus server):
#   ansible-playbook ghost9-range-ct.yml -e @~/.FGNW-deploy/ghost9-ct-vars.yml
# The file carries ghost9_ct_range_number, the ludus_extensions.ghost9 placement,
# the four ghost9_ct_api_* PVE token vars (the scoped ghost9-deploy@pve token:
# pool GHOST9) and the secrets ghost9_db_password / ghost9_n8n_owner_email /
# ghost9_n8n_owner_password. Nothing here reads a credential from a file.
#
# LIFECYCLE WARNING: the CT is NOT a Ludus range object. `ludus range rm` does not
# remove it, `ludus testing start` neither snapshots nor seals it, and `ludus range
# list` does not show it. Remove it with
#   ansible-playbook ghost9-range-ct.yml -e @<extra-vars file> -t destroy \
#     -e lxc_guest_confirm_destroy=true
# (the same range number and token vars; lxc_guest refuses a CT that is not the one
# this play describes). Addressing: net0 is
#   name=eth0,bridge=r<N>,tag=<vlan>,ip=10.<N>.<vlan>.<octet>/24,gw=10.<N>.<vlan>.254,mtu=<bridge MTU>
# — `bridge` + `tag` is how Ludus attaches a range VM in cluster mode, .254 is the
# range router, and the MTU is read from the bridge because the range VNets are SDN
# VXLAN (1450) on a cluster and plain bridges (1500) on a single node.
- name: "Ghost9: create the range container on this node from the ghost9 LXC template"
  hosts: localhost
  connection: local
  gather_facts: false
  vars: &ghost9_ct_vars
    # --- Inputs (the extra-vars file; defaults match blueprints/FGNW/range-config.yml) --
    ghost9_ct_range_number: ""
    ghost9_ct_vlan: 99
    ghost9_ct_last_octet: 51
    ghost9_ct_hostname_suffix: ghost9
    ghost9_ct_cores: 4
    ghost9_ct_memory_mb: 6144
    ghost9_ct_rootfs_gb: 20
    ghost9_ct_storage: local-zfs
    ghost9_ct_template_image: ""
    ghost9_ct_template_version: ""
    ghost9_ct_template_registry_base: ghcr.io/get-sybers/lxc
    ghost9_ct_allow_ghosts_vm: false
    # --- Derived placement (everything addressable comes from the range number) ------
    ghost9_ct_bridge: "r{{ ghost9_ct_range_number }}"
    ghost9_ct_subnet_prefix: "10.{{ ghost9_ct_range_number }}.{{ ghost9_ct_vlan }}"
    ghost9_ct_ip: "{{ ghost9_ct_subnet_prefix }}.{{ ghost9_ct_last_octet }}"
    ghost9_ct_cidr: 24
    ghost9_ct_gateway: "{{ ghost9_ct_subnet_prefix }}.254"
    # Range-scoped CT id: the destroy guard keys on it, so a fixed id would let one
    # range's teardown find another range's container.
    ghost9_ct_vmid: "{{ 9000 + (ghost9_ct_range_number | int) }}"
    ghost9_ct_hostname: "r{{ ghost9_ct_range_number }}-{{ ghost9_ct_hostname_suffix }}"
    ghost9_ct_pool: GHOST9
    ghost9_ct_group: ghost9_ct
    ghost9_ct_net0: >-
      {{ ['name=eth0', 'bridge=' ~ ghost9_ct_bridge, 'tag=' ~ ghost9_ct_vlan,
          'ip=' ~ ghost9_ct_ip ~ '/' ~ ghost9_ct_cidr, 'gw=' ~ ghost9_ct_gateway,
          'mtu=' ~ __g9_bridge_mtu] | join(',') }}
    # --- get_sybers.lxc collection variables (every lxc_* role default points at these)
    lxc_node: "{{ __g9_node }}"
    lxc_storage: "{{ ghost9_ct_storage }}"
    lxc_bridge: "{{ ghost9_ct_bridge }}"
    lxc_template: local:vztmpl/ghost9.tar
    lxc_template_url: ""
    lxc_template_checksum: ""
    lxc_template_cache_dir: /var/lib/vz/template/cache
    lxc_template_release_base: https://github.com/get-sybers/lxc/releases/download
    lxc_template_registry_base: "{{ ghost9_ct_template_registry_base }}"
    lxc_baseline_marker_path: /etc/get-sybers-lxc-baseline
    lxc_template_marker_path: /etc/get-sybers-lxc-template
    # lxc_preflight admits a host `pvecm nodes` does not list (a single node) when it
    # is a member of this group; play 1 declares this node in it.
    lxc_preflight_cluster_group: proxmox_nodes
  module_defaults:
    group/community.proxmox.proxmox: &ghost9_pve_api
      api_host: "{{ ghost9_ct_api_host }}"
      api_user: "{{ ghost9_ct_api_user }}"
      api_token_id: "{{ ghost9_ct_api_token_id }}"
      api_token_secret: "{{ ghost9_ct_api_token_secret }}"
      validate_certs: false
  tasks:
    - name: "Preflight: The scoped Proxmox API token was passed as extra-vars"
      ansible.builtin.assert:
        that:
          - ghost9_ct_api_user | default('') | length > 0
          - ghost9_ct_api_token_id | default('') | length > 0
          - ghost9_ct_api_token_secret | default('') | length > 0
          - ghost9_ct_api_host | default('') | length > 0
        fail_msg: >-
          ghost9-range-ct.yml needs the scoped Proxmox API token as extra vars
          (ghost9_ct_api_user, ghost9_ct_api_token_id, ghost9_ct_api_token_secret,
          ghost9_ct_api_host) — deploy-tasks/phase1b-ghost9.yml writes them into the
          0600 extra-vars file. Nothing here reads a token from a file.
        quiet: true
      no_log: true
    - name: "Preflight: The range number is set and numeric"
      ansible.builtin.assert:
        that:
          - ghost9_ct_range_number | string | length > 0
          - ghost9_ct_range_number | string is match('^[0-9]+$')
          - ghost9_ct_range_number | int > 0
          - ghost9_ct_range_number | int < 255
        fail_msg: >-
          ghost9_ct_range_number is required and must be the range's second octet
          (got '{{ ghost9_ct_range_number }}'). The VNet r<N>, the address
          10.<N>.{{ ghost9_ct_vlan }}.{{ ghost9_ct_last_octet }}, the gateway and the
          CT id all derive from it; guessing it is how a container lands on a previous
          deploy's network.
        quiet: true
    - name: "Preflight: The template image and the template release are pinned"
      ansible.builtin.assert:
        that:
          - ghost9_ct_template_image | length > 0
          - ghost9_ct_template_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
        fail_msg: >-
          ghost9_ct_template_image (the GHCR OCI image, ideally @sha256:<digest>) and
          ghost9_ct_template_version (the template release the guest marker must carry,
          X.Y.Z) come from range-config.yml ludus_extensions.ghost9 — got
          image='{{ ghost9_ct_template_image }}' version='{{ ghost9_ct_template_version }}'.
        quiet: true
    - name: "Facts: Read this node's name"
      ansible.builtin.command:
        argv: [hostname, -s]
      register: __g9_hostname_short
      changed_when: false
      check_mode: false
    - name: "Facts: Read this node's hostname as lxc_preflight reads it"
      ansible.builtin.command:
        argv: [hostname]
      register: __g9_hostname_full
      changed_when: false
      check_mode: false
    - name: "Facts: Derive the node name"
      ansible.builtin.set_fact:
        __g9_node: "{{ __g9_hostname_short.stdout | trim }}"
    - name: "Facts: Declare this node in the proxmox_nodes group for lxc_preflight"
      ansible.builtin.add_host:
        name: "{{ __g9_hostname_full.stdout | trim }}"
        groups: "{{ lxc_preflight_cluster_group }}"
      changed_when: false
    - name: "Facts: Read the SDN VNet definitions"
      ansible.builtin.command:
        argv: [cat, /etc/pve/sdn/vnets.cfg]
      register: __g9_vnets_raw
      changed_when: false
      check_mode: false
      failed_when: false
    - name: "Facts: Stat the range bridge on this node"
      ansible.builtin.stat:
        path: "/sys/class/net/{{ ghost9_ct_bridge }}"
      register: __g9_bridge_stat
      check_mode: false
    - name: "Facts: Read the range bridge's MTU"
      ansible.builtin.command:
        argv: [cat, "/sys/class/net/{{ ghost9_ct_bridge }}/mtu"]
      register: __g9_mtu_raw
      changed_when: false
      check_mode: false
      failed_when: false
    - name: "Facts: Read the guests the cluster knows about"
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      register: __g9_resources_raw
      changed_when: false
      check_mode: false
      failed_when: false
    - name: "Facts: Parse what the node reported"
      ansible.builtin.set_fact:
        __g9_vnets: "{{ __g9_vnets_raw.stdout | default('') | regex_findall('(?m)^vnet:\\s+(\\S+)\\s*$') }}"
        __g9_bridge_mtu: >-
          {{ (__g9_mtu_raw.stdout | default('') | trim)
             if ((__g9_mtu_raw.rc | default(1)) == 0
                 and (__g9_mtu_raw.stdout | default('') | trim) is match('^[0-9]+$'))
             else '' }}
        __g9_ghosts_guests: >-
          {{ ((__g9_resources_raw.stdout | from_json)
              if ((__g9_resources_raw.rc | default(1)) == 0
                  and (__g9_resources_raw.stdout | default('') | trim).startswith('['))
              else [])
             | selectattr('name', 'defined') | selectattr('name', 'search', '-ghosts$')
             | map(attribute='name') | list }}
    - name: "Preflight: The range's SDN VNet is declared"
      ansible.builtin.assert:
        that: ghost9_ct_bridge in __g9_vnets
        fail_msg: >-
          VNet '{{ ghost9_ct_bridge }}' is not declared in /etc/pve/sdn/vnets.cfg
          (declared: {{ __g9_vnets | join(', ') or 'none' }}). Either the range number
          is wrong or the range's VNet has not been created — Ludus does not
          auto-create SDN VNets in cluster mode.
        quiet: true
    - name: "Preflight: The VNet's bridge exists on this node"
      ansible.builtin.assert:
        that: __g9_bridge_stat.stat.exists
        fail_msg: >-
          VNet '{{ ghost9_ct_bridge }}' is declared but has no interface on
          {{ __g9_node }} — the SDN config has not been applied here. A CT on a
          nonexistent bridge boots looking healthy with no network at all.
        quiet: true
    - name: "Preflight: The bridge's MTU was read"
      ansible.builtin.assert:
        that:
          - __g9_bridge_mtu | string is match('^[0-9]+$')
          - __g9_bridge_mtu | int > 0
        fail_msg: >-
          Could not read the MTU of '{{ ghost9_ct_bridge }}' from
          /sys/class/net/{{ ghost9_ct_bridge }}/mtu on {{ __g9_node }}. net0 pins the
          CT to the bridge's MTU because on a Ludus cluster the range VNets are SDN
          VXLAN at 1450 — a CT left at 1500 passes small packets and silently
          black-holes anything larger across the overlay. Refusing to guess.
        quiet: true
    - name: "Preflight: No Ludus-managed GHOSTS VM is competing for the range address"
      ansible.builtin.assert:
        that: (__g9_ghosts_guests | length == 0) or (ghost9_ct_allow_ghosts_vm | bool)
        fail_msg: >-
          The cluster already carries {{ __g9_ghosts_guests | join(', ') }}. A `-ghosts`
          VM takes ip_last_octet {{ ghost9_ct_last_octet }} on vlan {{ ghost9_ct_vlan }}
          — the address {{ ghost9_ct_hostname }} would take, so both would answer for
          {{ ghost9_ct_ip }}. Remove the VM from the range config (this CT replaces
          it), or set ghost9_ct_allow_ghosts_vm=true if one of them has been moved.
        quiet: true
    - name: "Preflight: Passed"
      ansible.builtin.debug:
        msg: >-
          GHOST9 RANGE PREFLIGHT OK — will place CT {{ ghost9_ct_vmid }}
          ({{ ghost9_ct_hostname }}) on {{ ghost9_ct_bridge }} tag {{ ghost9_ct_vlan }}
          mtu {{ __g9_bridge_mtu }} at {{ ghost9_ct_ip }}/{{ ghost9_ct_cidr }}
          gw {{ ghost9_ct_gateway }}, from {{ ghost9_ct_template_image }}
          (template release {{ ghost9_ct_template_version }}).
    - name: "Preflight: Node admission gate (root, PVE node, pct)"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_preflight
    - name: "Container: Ensure the GHOSTS LXC through get_sybers.lxc.lxc_ghost9"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_ghost9
        tasks_from: container
      vars:
        lxc_ghost9_vmid: "{{ ghost9_ct_vmid }}"
        lxc_ghost9_hostname: "{{ ghost9_ct_hostname }}"
        lxc_ghost9_net0: "{{ ghost9_ct_net0 }}"
        lxc_ghost9_nameserver: "{{ ghost9_ct_gateway }}"
        lxc_ghost9_pool: "{{ ghost9_ct_pool }}"
        lxc_ghost9_cores: "{{ ghost9_ct_cores }}"
        lxc_ghost9_memory_mb: "{{ ghost9_ct_memory_mb }}"
        lxc_ghost9_rootfs_gb: "{{ ghost9_ct_rootfs_gb }}"
        lxc_ghost9_template_image: "{{ ghost9_ct_template_image }}"
        lxc_ghost9_template_version: "{{ ghost9_ct_template_version }}"
        lxc_ghost9_group: "{{ ghost9_ct_group }}"
        lxc_ghost9_onboot: true
    - name: "Postcheck: Re-read the CT config from Proxmox (decoded)"
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/nodes/{{ __g9_node }}/lxc/{{ ghost9_ct_vmid }}/config"
          - --output-format
          - json
      register: __g9_post_config
      changed_when: false
      check_mode: false
    - name: "Postcheck: Parse the config"
      ansible.builtin.set_fact:
        __g9_post: "{{ __g9_post_config.stdout | from_json }}"
    - name: "Postcheck: It is attached to the range VNet on the range VLAN, at the range address, at the bridge MTU"
      ansible.builtin.assert:
        that:
          - ('bridge=' ~ ghost9_ct_bridge ~ ',') in (__g9_post['net0'] | default('') ~ ',')
          - ('tag=' ~ ghost9_ct_vlan ~ ',') in (__g9_post['net0'] | default('') ~ ',')
          - ('ip=' ~ ghost9_ct_ip ~ '/' ~ ghost9_ct_cidr ~ ',') in (__g9_post['net0'] | default('') ~ ',')
          - ('gw=' ~ ghost9_ct_gateway ~ ',') in (__g9_post['net0'] | default('') ~ ',')
          - ('mtu=' ~ __g9_bridge_mtu ~ ',') in (__g9_post['net0'] | default('') ~ ',')
        fail_msg: >-
          net0 is not on {{ ghost9_ct_bridge }} tag {{ ghost9_ct_vlan }} at
          {{ ghost9_ct_ip }}/{{ ghost9_ct_cidr }} gw {{ ghost9_ct_gateway }}
          mtu {{ __g9_bridge_mtu }}. Actual net0: {{ __g9_post['net0'] | default('<no net0>') }}.
          A CT on the right bridge but the wrong VLAN tag comes up looking healthy and
          is unreachable from every range client; one without the bridge MTU
          black-holes large packets across the VXLAN overlay. lxc_guest reconciles
          net0 on every run, so Proxmox did not accept the requested value — check the
          create task's result and `pct config {{ ghost9_ct_vmid }}`.
        quiet: true
    - name: "Postcheck: Ready"
      ansible.builtin.debug:
        msg: >-
          GHOST9 CT {{ ghost9_ct_vmid }} ({{ ghost9_ct_hostname }}) running at
          {{ ghost9_ct_ip }} on {{ ghost9_ct_bridge }}/vlan{{ ghost9_ct_vlan }},
          unprivileged, nesting=1, onboot=1. The baseline and the service
          configuration follow inside the CT (plays 2 and 3).
- name: "Ghost9: harden the guest baseline inside the LXC"
  hosts: ghost9_ct
  gather_facts: false
  vars: *ghost9_ct_vars
  tasks:
    - name: "Baseline: No SSH daemon, no container runtime, baseline marker (get_sybers.lxc.lxc_guest)"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_guest
        tasks_from: baseline
- name: "Ghost9: configure and verify the GHOSTS stack inside the LXC"
  hosts: ghost9_ct
  gather_facts: false
  vars: *ghost9_ct_vars
  tasks:
    - name: "Server: The GHOSTS server secrets were passed as extra-vars"
      ansible.builtin.assert:
        that:
          - ghost9_db_password | default('') | length > 0
          - ghost9_n8n_owner_password | default('') | length > 0
        fail_msg: >-
          ghost9_db_password and ghost9_n8n_owner_password must be set (the extra-vars
          file deploy-tasks/phase1b-ghost9.yml writes carries them: supplied to
          deploy.yml, or generated per deploy). The PostgreSQL password backs the API
          connection string and the Grafana datasource; the n8n owner is created once.
        quiet: true
      no_log: true
    - name: "Server: Firewall, PostgreSQL, site config, start all services, provision n8n, verify (get_sybers.lxc.lxc_ghost9)"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_ghost9
        tasks_from: server
      vars:
        lxc_ghost9_public_hostname: "{{ ghost9_ct_ip }}"
        lxc_ghost9_template_version: "{{ ghost9_ct_template_version }}"
        lxc_ghost9_db_password: "{{ ghost9_db_password }}"
        lxc_ghost9_n8n_owner_email: "{{ ghost9_n8n_owner_email | default('admin@ghosts.local') }}"
        lxc_ghost9_n8n_owner_password: "{{ ghost9_n8n_owner_password }}"
    - name: "Server: Where to point GHOSTS clients"
      ansible.builtin.debug:
        msg: >-
          GHOSTS clients for range {{ ghost9_ct_range_number }} use
          ApiRootUrl = http://{{ ghost9_ct_ip }}:5000/api (range-config.yml
          global_role_vars.ghosts_config_replace already says so). Operator UI
          http://{{ ghost9_ct_ip }}:4200/, Grafana http://{{ ghost9_ct_ip }}:3000/,
          n8n http://{{ ghost9_ct_ip }}:5678/ (the n8n owner account from the
          extra-vars file). ghost9-verify.yml re-proves the API, UI and markers
          read-only.
- name: "Ghost9: destroy the range container (opt-in: -t destroy -e lxc_guest_confirm_destroy=true)"
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [never, destroy]
  vars: *ghost9_ct_vars
  module_defaults:
    group/community.proxmox.proxmox: *ghost9_pve_api
  tasks:
    - name: "Destroy: The scoped Proxmox API token was passed as extra-vars"
      ansible.builtin.assert:
        that:
          - ghost9_ct_api_user | default('') | length > 0
          - ghost9_ct_api_token_id | default('') | length > 0
          - ghost9_ct_api_token_secret | default('') | length > 0
          - ghost9_ct_api_host | default('') | length > 0
        fail_msg: >-
          The destroy needs the same four ghost9_ct_api_* extra vars as the create
          (write a fresh 0600 extra-vars file; the deploy's copy was shredded).
        quiet: true
      no_log: true
    - name: "Destroy: The range number is set and numeric"
      ansible.builtin.assert:
        that:
          - ghost9_ct_range_number | string is match('^[0-9]+$')
          - ghost9_ct_range_number | int > 0
          - ghost9_ct_range_number | int < 255
        fail_msg: >-
          ghost9_ct_range_number is required (got '{{ ghost9_ct_range_number }}'): the
          CT id 9000+N and the hostname r<N>-ghost9 lxc_guest refuses to destroy
          anything else derive from it.
        quiet: true
    - name: "Destroy: Read this node's name"
      ansible.builtin.command:
        argv: [hostname, -s]
      register: __g9_hostname_short
      changed_when: false
      check_mode: false
    - name: "Destroy: Read this node's hostname as lxc_preflight reads it"
      ansible.builtin.command:
        argv: [hostname]
      register: __g9_hostname_full
      changed_when: false
      check_mode: false
    - name: "Destroy: Derive the node name"
      ansible.builtin.set_fact:
        __g9_node: "{{ __g9_hostname_short.stdout | trim }}"
    - name: "Destroy: Declare this node in the proxmox_nodes group for lxc_preflight"
      ansible.builtin.add_host:
        name: "{{ __g9_hostname_full.stdout | trim }}"
        groups: "{{ lxc_preflight_cluster_group }}"
      changed_when: false
    - name: "Destroy: Node admission gate (root, PVE node, pct)"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_preflight
    - name: "Destroy: Destroy the GHOSTS CT through get_sybers.lxc.lxc_ghost9 (lxc_guest refuses the wrong CT)"
      ansible.builtin.include_role:
        name: get_sybers.lxc.lxc_ghost9
        tasks_from: remove
      vars:
        lxc_ghost9_vmid: "{{ ghost9_ct_vmid }}"
        lxc_ghost9_hostname: "{{ ghost9_ct_hostname }}"
        lxc_ghost9_net0: "name=eth0,bridge={{ ghost9_ct_bridge }}"
