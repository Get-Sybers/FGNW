---
# Phase 4e — Mozilla Thunderbird mail-client stack for every workstation in the range.
#
# Konoha workstations talk IMAP+SMTP to the Leaf Exchange server (konoha-mail): the first
# play below enables the Microsoft Exchange IMAP4 service on it and sets the login type to
# plain-text (required because the sealed range runs no TLS, and Exchange's IMAP service
# refuses cleartext logons by default). Workstations in villages with no Exchange server
# (Oto, Akatsuki) are skipped. The Sand workstation (suna-ws1) talks to the Postfix/Dovecot
# stack `fgnw_mac_mail_server` stood up in Phase 4d.
#
# The clients install from the installers cached on the range Nexus in Phase 0
# (nexus-cache-thunderbird.yml): the range is contained by now, so nothing here may reach
# download.mozilla.org. The mail servers are addressed as `mail.<domain>`, the A record the
# dnsforwarder role publishes on each village DC in Phase 4.
#
# Per-host identity (user / display / domain) is read from `content/ghosts/persona-timelines.yml`
# — the same source of truth GHOSTS uses — so a persona rename lands in both tools in one edit.
# Per-village mail-server FQDNs live in `vars/FGNW-thunderbird-map.yml`.
- name: Enable Exchange IMAP4 on the Leaf Exchange server (konoha-mail)
  hosts: exchange_servers
  gather_facts: false
  vars_files:
    - vars/FGNW-thunderbird-imap.yml
  tasks:
    - name: "Imap: set MSExchangeIMAP4 / MSExchangeIMAP4BE to Automatic + started"
      ansible.windows.win_service:
        name: "{{ item }}"
        start_mode: auto
        state: started
      loop:
        - MSExchangeIMAP4
        - MSExchangeIMAP4BE

    # Exchange cmdlets need an Exchange RBAC role, which the local WinRM user does not hold
    # (Get-ImapSettings fails with "the supplied credential ... is invalid" and returns
    # nothing): the task runs as the forest-root Administrator, the way the other Exchange
    # plays do, and fails on any error instead of reporting the login type as already set.
    - name: "Imap: set every ImapSettings server to PlainTextLogin (sealed-range cleartext over VLAN-local)"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        Add-PSSnapin Microsoft.Exchange.Management.PowerShell.SnapIn
        $servers = @(Get-ImapSettings)
        if ($servers.Count -eq 0) { throw 'Get-ImapSettings returned no server' }
        $changedAny = $false
        foreach ($s in $servers) {
          if ($s.LoginType -ne 'PlainTextLogin') {
            Set-ImapSettings -Server $s.Server -LoginType PlainTextLogin
            $changedAny = $true
          }
        }
        $after = @(Get-ImapSettings | Where-Object { $_.LoginType -ne 'PlainTextLogin' })
        if ($after.Count -gt 0) { throw "LoginType is still not PlainTextLogin on: $($after.Server -join ', ')" }
        if ($changedAny) { Write-Output 'IMAP_LOGIN_TYPE_SET' } else { Write-Output 'IMAP_LOGIN_TYPE_ALREADY_SET' }
      register: __imap_login
      changed_when: "'IMAP_LOGIN_TYPE_SET' in __imap_login.stdout"
      vars:
        ansible_become: true
        ansible_become_method: runas
        ansible_become_user: "{{ fgnw_exchange_forest_root_map[inventory_hostname] }}\\Administrator"
        ansible_become_password: password

    - name: "Imap: restart the MSExchangeIMAP4 services if LoginType changed (so Thunderbird picks up PlainTextLogin on next connect)"
      ansible.windows.win_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - MSExchangeIMAP4
        - MSExchangeIMAP4BE
      when: "'IMAP_LOGIN_TYPE_SET' in __imap_login.stdout"

- name: Thunderbird on every Windows workstation (IMAP+SMTP to its village Exchange)
  hosts: ghosts_clients
  gather_facts: true
  vars_files:
    - vars/FGNW-thunderbird-map.yml
  tasks:
    - name: "Tbird: load persona-timelines.yml (per-host persona lookup)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../content/ghosts/persona-timelines.yml"
        name: __ptl

    - name: "Tbird: resolve this host's persona"
      ansible.builtin.set_fact:
        __p: "{{ __ptl.ghosts_personas[inventory_hostname] }}"

    - name: "Tbird: resolve this host's village mail server (villages with an Exchange server only)"
      ansible.builtin.set_fact:
        __mail_fqdn: "{{ __fgnw_village_mail_fqdn[__p.ad_domain] }}"
      when: __p.ad_domain in __fgnw_village_mail_fqdn

    - name: "Tbird: install + preconfigure Thunderbird (Exchange villages only) for the persona {{ __p.sam }}"
      ansible.builtin.include_role:
        name: fgnw_thunderbird
      vars:
        fgnw_thunderbird_user: "{{ __p.sam }}"
        fgnw_thunderbird_display_name: "{{ __p.character }}"
        fgnw_thunderbird_mail_domain: "{{ __p.ad_domain }}"
        fgnw_thunderbird_imap_server: "{{ __mail_fqdn }}"
        fgnw_thunderbird_smtp_server: "{{ __mail_fqdn }}"
      when: __p.ad_domain in __fgnw_village_mail_fqdn

- name: Thunderbird on the Sand macOS workstation (IMAP to Dovecot, SMTP to Postfix)
  hosts: macos_dev
  gather_facts: true
  vars_files:
    - vars/FGNW-thunderbird-map.yml
  tasks:
    - name: "Tbird: load persona-timelines.yml (per-host persona lookup)"
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../content/ghosts/persona-timelines.yml"
        name: __ptl
      when: inventory_hostname == 'suna-ws1'

    - name: "Tbird: resolve this host's persona and its village mail server"
      ansible.builtin.set_fact:
        __p: "{{ __ptl.ghosts_personas[inventory_hostname] }}"
        __mail_fqdn: "{{ __fgnw_village_mail_fqdn[__ptl.ghosts_personas[inventory_hostname].ad_domain] }}"
      when: inventory_hostname == 'suna-ws1'

    - name: "Tbird: install + preconfigure Thunderbird for the persona {{ __p.sam }}"
      ansible.builtin.include_role:
        name: fgnw_thunderbird
      vars:
        fgnw_thunderbird_user: "{{ __p.sam }}"
        fgnw_thunderbird_display_name: "{{ __p.character }}"
        fgnw_thunderbird_mail_domain: "{{ __p.ad_domain }}"
        fgnw_thunderbird_imap_server: "{{ __mail_fqdn }}"
        fgnw_thunderbird_smtp_server: "{{ __mail_fqdn }}"
      when: inventory_hostname == 'suna-ws1'
