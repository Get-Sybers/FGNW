---
- name: Join ninjasploitable to fire.ninja
  hosts: "{{ target | default('ninjasploitable') }}"
  gather_facts: true
  vars_files:
    - vars/FGNW-ninjasploitable-join.yml
  tasks:
    - name: Load the AD config (for the fire.ninja domain-admin password)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../ad/NARUTO/data/config.json"
        name: ad_config
      no_log: true
    - name: Derive fire-dc1 IP + admin creds from config
      ansible.builtin.set_fact:
        fire_dc_ip: 10.{{ ansible_host.split('.')[1] }}.10.15
        fire_admin_password: "{{ ad_config.lab.domains[ad_domain].domain_password }}"
      no_log: true
    - name: Point DNS at the fire.ninja DC so the domain resolves
      become: true
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ fire_dc_ip }}
          search {{ ad_domain }}
        owner: root
        group: root
        mode: "0644"
    - name: Preseed the Kerberos default realm (avoid interactive krb5-config prompt)
      become: true
      ansible.builtin.debconf:
        name: krb5-config
        question: krb5-config/default_realm
        vtype: string
        value: "{{ ad_domain | upper }}"
    - name: "Ninjasploitable: route apt through the Nexus Debian proxy (contained range)"
      become: true
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nexus-debian.list
        owner: root
        group: root
        mode: "0644"
        content: |
          deb http://192.0.2.2:8081/repository/debian-proxy {{ ansible_facts['distribution_release'] }} main non-free-firmware
          deb http://192.0.2.2:8081/repository/debian-proxy {{ ansible_facts['distribution_release'] }}-updates main non-free-firmware
          deb http://192.0.2.2:8081/repository/debian-security-proxy {{ ansible_facts['distribution_release'] }}-security main non-free-firmware
    - name: "Ninjasploitable: disable the internet apt sources that can't resolve under containment"
      become: true
      ansible.builtin.command:
        cmd: mv /etc/apt/sources.list /etc/apt/sources.list.disabled
        removes: /etc/apt/sources.list
    - name: Install realmd/sssd AD-join packages
      become: true
      ansible.builtin.apt:
        name:
          - realmd
          - sssd
          - sssd-tools
          - adcli
          - samba-common-bin
          - krb5-user
          - packagekit
          - libnss-sss
          - libpam-sss
          - oddjob
          - oddjob-mkhomedir
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive
    - name: Check current realm membership
      become: true
      ansible.builtin.command: realm list
      register: realm_list
      changed_when: false
      failed_when: false
    - name: Join ninjasploitable to {{ ad_domain }}
      ansible.builtin.shell: |
        set -o pipefail
        echo '{{ fire_admin_password }}' | realm join --user={{ ad_admin }} {{ ad_domain }}
      args:
        executable: /bin/bash
      changed_when: true
      when: ad_domain not in (realm_list.stdout | default(''))
      no_log: true
    - name: Enable home-dir creation on first login
      become: true
      ansible.builtin.command: pam-auth-update --enable mkhomedir
      changed_when: false
    - name: Verify membership
      become: true
      ansible.builtin.command: realm list
      register: realm_after
      changed_when: false
    - name: Report join result
      ansible.builtin.debug:
        msg: "ninjasploitable joined to {{ ad_domain }}: {{ ad_domain in (realm_after.stdout | default('')) }}"
