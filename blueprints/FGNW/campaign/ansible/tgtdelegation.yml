      ansible.windows.win_command: netdom.exe trust otogakure.ninja /domain:fire.ninja /EnableTGTDelegation:Yes
      register: tgtdeleg
      until: tgtdeleg.rc == 0
      retries: 2
      delay: 30
- name: Reboot all DCs to apply deleg settings
  hosts: dc
  tasks:
    - name: Reboot
      ansible.windows.win_reboot:
    - name: Wait for machines to come back online
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 300
