---
- name: Enable TGT delegation for parent-child abuse on the suna domain controller - this can fail, while the trust is still building so we retry a few times
  hosts: suna-dc1
  tasks:
    - name: Enable TGT delegation
      ansible.windows.win_command: netdom.exe trust sunagakure.wind.ninja /domain:wind.ninja /EnableTGTDelegation:Yes
      register: tgtdeleg
      until: tgtdeleg.rc == 0
      retries: 2
      delay: 30
- name: Enable TGT delegation for parent-child abuse on the Land of Wind domain controller - this can fail, while the trust is still building so we retry a few
    times
  hosts: wind-dc1
  tasks:
    - name: Enable TGT delegation
      ansible.windows.win_command: netdom.exe trust wind.ninja /domain:sunagakure.wind.ninja /EnableTGTDelegation:Yes
      register: tgtdeleg
