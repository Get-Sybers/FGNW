- name: Enable TGT delegation for external trust on the fire domain controller - this can fail, while the trust is still building so we retry a few times
  hosts: fire-dc1
  tasks:
    - name: Enable TGT delegation
      ansible.windows.win_command: netdom.exe trust fire.ninja /domain:otogakure.ninja /EnableTGTDelegation:Yes
