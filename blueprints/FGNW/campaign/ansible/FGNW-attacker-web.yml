---
- name: Deploy Akatsuki tool-cache web server
  hosts: attacker
  vars_files:
    - vars/FGNW-attacker-web.yml
    - ../content/www/attacker-tools.yml
  tasks:
    - name: "Attacker-web: publish the Akatsuki tool cache"
      ansible.builtin.include_role:
        name: ludus_tool_cache
        apply:
          become: true
