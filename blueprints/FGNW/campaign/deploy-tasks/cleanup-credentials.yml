---
- name: "deploy-tasks | cleanup-credentials | Shred the materialized run files"
  ansible.builtin.command:
    argv: [shred, -u, "{{ item }}"]
  loop: "{{ __cleanup_paths }}"
  changed_when: false
  failed_when: false
- name: "deploy-tasks | cleanup-credentials | Stat the materialized run files after the shred"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ __cleanup_paths }}"
  register: __shred_stat
- name: "deploy-tasks | cleanup-credentials | Fail if a credential file still exists after shred"
  ansible.builtin.fail:
    msg: >-
      SECURITY: {{ item['item'] }} still exists after `shred -u` — it may contain a cleartext SSH
      password, the AD data model's domain passwords, the scoped Proxmox token or the GHOSTS
      server secrets of phase 1b. Remove it manually from {{ __tmp_dir }}.
  loop: "{{ __shred_stat.results }}"
  loop_control:
    label: "{{ item['item'] }}"
  when: item['stat']['exists'] | bool
