      subject: That is when I realized that in all of the world no one needed me. I was alone.
    - body: When people are protecting something truly precious to them. They truly can become...as strong as they need to be!
      from_address: haku@konohagakure.fire.ninja
      from_name: Haku
      subject: When people are protecting something truly precious to them. They truly can beco...
