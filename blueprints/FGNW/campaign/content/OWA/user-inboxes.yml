      subject: It's always like this. The only things I can ever do for Naruto are the little t...
    - body: (About Sakura) Was she having fun in her little make-believe fantasy of true love? As for me, I have absolutely no reason to love her and likewise,
        I can see no reason why she would love me.
      from_address: sasuke.uchiha@konohagakure.fire.ninja
      from_name: Sasuke Uchiha
      subject: (About Sakura) Was she having fun in her little make-believe fantasy of true lov...
    - body: "Our sensors detected two separate real-time subnet sweeps overnight -- one against the Fire/Leaf
        network block, one against Sand's -- followed by a systematic vulnerability scan of both, all from an
        unregistered endpoint with no village attribution. Scan pattern was loud and unconcealed: full
        service-version probing, vulnerability-script enumeration, no attempt to blend into normal traffic.
        This is consistent with the profiled TTP signature Allied Intelligence has on file for known hostile
        reconnaissance actors (see the classified Mission Reports intel bulletin if you have not read it). No
        credentials were used and no breach occurred -- this appears to be preparatory scanning, not an active
        intrusion. All active shinobi should treat any follow-up activity from the same signature as high
        priority."
      from_address: intel@konoha-portal.leaf
      from_name: Allied Intelligence Division
      subject: "RECON ALERT: Subnet sweep and vulnerability scan detected -- Fire/Leaf/Sand"
    - body: Following the overnight scan (see the linked RECON ALERT), a short burst of connection flooding was detected against both the Leaf portal and Sand's
        directory server -- roughly twenty connection attempts per second for about thirty seconds each, then a clean stop. Neither service was meaningfully
        affected. This kind of bounded, obviously-loud flood is not how a real breach attempt behaves -- it reads as a capability test or a distraction, not a
        serious denial-of-service effort. Intel division is treating this as part of the same reconnaissance signature as the scan, not a separate incident.
      from_address: intel@konoha-portal.leaf
      from_name: Allied Intelligence Division
      subject: "DOS ALERT: Network flood attempt detected -- Leaf portal / Sand directory server"
  kakuzu:
