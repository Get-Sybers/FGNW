    - body: It's never been "The one who becomes Hokage will be acknowledge by everyone", it's "The one who is acknowledge by everyone, becomes the Hokage".
      from_address: itachi.uchiha@akatsuki.dark
      from_name: Itachi Uchiha
      subject: It's never been "The one who becomes Hokage will be acknowledge by everyone", it...
    - body: The people of this clan are all the same. You focus on the trivial, and lose sight of what's most important. Change is impossible, in this fog of
