      subject: Kakuzu... Could you get me my body, pleeease?
    - body: "*last words* Forgive me Sasuke... It ends with this."
      from_address: itachi.uchiha@akatsuki.dark
      from_name: Itachi Uchiha
      subject: "*last words* Forgive me Sasuke... It ends with this."
    - body: I'll admit that you're stronger than before. But because of that, you seem to have lost sight of what's truly important. Now listen carefully. The
        people of the village, who once abhorred you, have begun to admire you. They think of you as a comrade. It's because you fought hard for their
        acceptance. You once said it was everyone who cares about you who helped you get where you are now. If you forget others because you have power, and
        become arrogant and egotistical, you'll eventually become just like Madara. No matter how powerful you become, do not try to shoulder everything alone.
        Becoming the Hokage doesn't mean people will acknowledge you. But when the people acknowledge you, you can become Hokage. Never forget your friends!
      from_address: itachi.uchiha@akatsuki.dark
      from_name: Itachi Uchiha
      subject: I'll admit that you're stronger than before. But because of that, you seem to ha...
    - body: People live their lives bound by what they accept as correct and true. That's how they define "reality". But what does it mean to be "correct" or
        "true"? Merely vague concepts... Their "reality" may all be a mirage. Can we consider them to simply be living in their own world, shaped by their
        beliefs?
      from_address: itachi.uchiha@akatsuki.dark
      from_name: Itachi Uchiha
      subject: People live their lives bound by what they accept as correct and true. That's ho...
    - body: We are humans, not fish. We don't know what kind of people we truly are until the moment before our deaths. As death comes to embrace you, you will
        realize what you are. That's what death is, don't you think?
      from_address: itachi.uchiha@akatsuki.dark
      from_name: Itachi Uchiha
      subject: We are humans, not fish. We don't know what kind of people we truly are until th...
