      subject: "*to Sakumo* Regardless of what happened, you did the best you could. I understan..."
    - body: I'm Kakashi Hatake. Things I like and things I hate...I don't feel like telling you that. My dreams for the future...never really thought about it.
        As for my hobbies...I have lots of hobbies.
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: I'm Kakashi Hatake. Things I like and things I hate...I don't feel like telling ...
    - body: The hole in one's heart gets filled by others around you. Friends won't flock to someone who abandons the memory of his friends and gives up on the
        world just because things don't go the way he wants them to. That won't help fill the hole in your heart. And people won't help those who run away and
        do nothing. As long as you don't give up, there will always be salvation.
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: The hole in one's heart gets filled by others around you. Friends won't flock to...
    - body: Hey, you stupid fox! You're in my body and you owe me rent! So for payment, I'll take your chakra! You got that?!
      from_address: naruto.uzumaki@konohagakure.fire.ninja
      from_name: Naruto Uzumaki
      subject: Hey, you stupid fox! You're in my body and you owe me rent! So for payment, I'll...
    - body: It's not the face that makes someone a monster, it's the choices they make with their lives.
      from_address: naruto.uzumaki@konohagakure.fire.ninja
      from_name: Naruto Uzumaki
      subject: It's not the face that makes someone a monster, it's the choices they make with ...
    - body: The pain of being alone is completely out of this world, isn't it? I don't know why, but I understand your feelings so much, it actually hurts.
      from_address: naruto.uzumaki@konohagakure.fire.ninja
      from_name: Naruto Uzumaki
      subject: The pain of being alone is completely out of this world, isn't it? I don't know ...
    - body: Come to think of it, didn't Naruto flunk that part?
      from_address: sakura.haruno@konohagakure.fire.ninja
      from_name: Sakura Haruno
      subject: Come to think of it, didn't Naruto flunk that part?
    - body: If you think I'm just a foolish kid ruled by his emotions, that's fine. Following Itachi's path would be childish, the whispering of fools who don't
