        truly free.
      from_address: kimimaro@otogakure.ninja
      from_name: Kimimaro
      subject: I've been wondering... There must be a purpose for people being born into this w...
    - body: Darkness. When everything that you know and love is taken away from you so harshly. All you can think about is anger, hatred and even revenge. And
        no one can save you.
      from_address: orochimaru@otogakure.ninja
      from_name: Orochimaru
