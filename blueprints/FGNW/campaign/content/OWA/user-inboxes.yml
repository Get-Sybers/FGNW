  tsunade:
    - body: "*to Orochimaru* You're wrong, that's not what makes a shinobi. You never did get it, a real ninja
        is one who endures no matter what gets thrown at him... Let me explain something to you, there is only
        one thing that matters if you are a shinobi, and it isn't the number of jutsu you possess. All you do
        need, is the guts to never give up."
      from_address: jiraiya@konohagakure.fire.ninja
      from_name: Jiraiya
      subject: "*to Orochimaru* You're wrong, that's not what makes a shinobi. You never did get..."
    - body: Die! Just Die! You have no talent at all!!
      from_address: jiraiya@konohagakure.fire.ninja
      from_name: Jiraiya
      subject: Die! Just Die! You have no talent at all!!
    - body: Never go back on your word...and never give up. That's your ninja way...and as your mentor ... I have no business whining! Because the student's
        ninja way should be the master's too! Isn't that so, Naruto?!
      from_address: jiraiya@konohagakure.fire.ninja
      from_name: Jiraiya
      subject: Never go back on your word...and never give up. That's your ninja way...and as y...
    - body: The true measure of a shinobi is not how he lives, but how he dies.
      from_address: jiraiya@konohagakure.fire.ninja
      from_name: Jiraiya
      subject: The true measure of a shinobi is not how he lives, but how he dies.
    - body: Hate only gives birth to even more hate.
      from_address: orochimaru@otogakure.ninja
      from_name: Orochimaru
      subject: Hate only gives birth to even more hate.
    - body: Inu pig!
      from_address: sakura.haruno@konohagakure.fire.ninja
      from_name: Sakura Haruno
      subject: Inu pig!
    - body: "Our sensors detected two separate real-time subnet sweeps overnight -- one against the Fire/Leaf
        network block, one against Sand's -- followed by a systematic vulnerability scan of both, all from an
        unregistered endpoint with no village attribution. Scan pattern was loud and unconcealed: full
        service-version probing, vulnerability-script enumeration, no attempt to blend into normal traffic.
        This is consistent with the profiled TTP signature Allied Intelligence has on file for known hostile
        reconnaissance actors (see the classified Mission Reports intel bulletin if you have not read it). No
        credentials were used and no breach occurred -- this appears to be preparatory scanning, not an active
        intrusion. All active shinobi should treat any follow-up activity from the same signature as high
        priority."
      from_address: intel@konoha-portal.leaf
      from_name: Allied Intelligence Division
      subject: "RECON ALERT: Subnet sweep and vulnerability scan detected -- Fire/Leaf/Sand"
    - body: Following the overnight scan (see the linked RECON ALERT), a short burst of connection flooding was detected against both the Leaf portal and Sand's
        directory server -- roughly twenty connection attempts per second for about thirty seconds each, then a clean stop. Neither service was meaningfully
        affected. This kind of bounded, obviously-loud flood is not how a real breach attempt behaves -- it reads as a capability test or a distraction, not a
        serious denial-of-service effort. Intel division is treating this as part of the same reconnaissance signature as the scan, not a separate incident.
      from_address: intel@konoha-portal.leaf
      from_name: Allied Intelligence Division
      subject: "DOS ALERT: Network flood attempt detected -- Leaf portal / Sand directory server"
  white.zetsu:
    - body: '....Would you consider dying together "Teamwork" as well?'
      from_address: madara.uchiha@akatsuki.dark
      from_name: Madara Uchiha
      subject: '....Would you consider dying together "Teamwork" as well?'
    - body: Man seeks peace, yet at the same time yearning for war... Those are the two realms belonging solely to man. Thinking of peace whilst spilling blood
        is something that only humans could do. They're two sides of the same coin... to protect something... another must be sacrificed.
      from_address: madara.uchiha@akatsuki.dark
      from_name: Madara Uchiha
      subject: Man seeks peace, yet at the same time yearning for war... Those are the two real...
    - body: Wake up to reality! Nothing ever goes as planned in this world. The longer you live, the more you realize that in this reality only pain, suffering
        and futility exist.
      from_address: madara.uchiha@akatsuki.dark
      from_name: Madara Uchiha
      subject: Wake up to reality! Nothing ever goes as planned in this world. The longer you l...
  yagura:
    - body: I fight for my sake only and live to love no one but myself.
      from_address: gaara@sunagakure.wind.ninja
      from_name: Gaara
      subject: I fight for my sake only and live to love no one but myself.
    - body: Not enough... blood.
      from_address: gaara@sunagakure.wind.ninja
      from_name: Gaara
      subject: Not enough... blood.
    - body: Up until now, my bonds with others have only been ones of hatred and murder. But, seeing him fight so hard made me wonder what a bond really is. I
        think I understand a little now. Suffering, sadness...and joy. To be able to share it with another person. Naruto Uzumaki...when I fought him, I feel
        that is what he taught me.
      from_address: gaara@sunagakure.wind.ninja
      from_name: Gaara
      subject: Up until now, my bonds with others have only been ones of hatred and murder. But...
  yahiko:
