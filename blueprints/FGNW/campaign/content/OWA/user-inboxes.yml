  kakashi.hatake:
    - body: I always lied to you telling you to forgive me. I used these hands to keep you at distance... I did not want you to get involved. But now... I think
        you could have changed father and mother. Perhaps even the entire Uchiha. If I would have stood in front of you and looked you in the eyes from the very
        beginning... talked to you instead of down to you... and been open about everything. But I failed, and speaking to you now, like this, isn't going to
        undo the permanent damage that's already been done to you. That's why I wanted to show you the truth. Even if it's just a little. And no matter what you
        decide to do from here on out, you never have to forgive me - I will always love you.
      from_address: itachi.uchiha@akatsuki.dark
      from_name: Itachi Uchiha
      subject: I always lied to you telling you to forgive me. I used these hands to keep you a...
    - body: Now I feel that maybe knowing who I actually am is the key to reach perfection. Because that means knowing what I can and cannot do.
