      subject: I have long since closed my eyes... My only goal is in the darkness.
  sakura.haruno.adult:
    - body: A ninja must see underneath the underneath.
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: A ninja must see underneath the underneath.
    - body: I've lived longer than you. And times have been bad. I know the pain of loss. You and I haven't really been fortunate. It's true. But it could be
