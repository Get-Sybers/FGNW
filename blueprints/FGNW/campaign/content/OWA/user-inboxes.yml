      subject: A hero is not the one who never falls. He is the one that who gets up, again and...
    - body: I am the Handsome Devil of the Hidden Leaf Village! My name is Rock Lee!
      from_address: rock.lee@konohagakure.fire.ninja
      from_name: Rock Lee
      subject: I am the Handsome Devil of the Hidden Leaf Village! My name is Rock Lee!
    - body: If you believe in your dreams, I will prove to you, that you can achieve your dreams just by working hard.
      from_address: rock.lee@konohagakure.fire.ninja
      from_name: Rock Lee
      subject: If you believe in your dreams, I will prove to you, that you can achieve your dr...
    - body: Stop it! How dare you disrespect an opponent that fought you with all he had!?
