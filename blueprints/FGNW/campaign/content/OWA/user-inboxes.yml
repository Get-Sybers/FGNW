    - body: I'm sure that the boy I killed, who shared that skill, must also have grown up knowing the pain of which I speak. We are special. We are powerful.
        And we are feared.
      from_address: haku@konohagakure.fire.ninja
      from_name: Haku
      subject: I'm sure that the boy I killed, who shared that skill, must also have grown up k...
    - body: Is there... somebody precious to you?
      from_address: haku@konohagakure.fire.ninja
      from_name: Haku
      subject: Is there... somebody precious to you?
    - body: It is only through the eyes of others that our lives have any meaning.
      from_address: haku@konohagakure.fire.ninja
      from_name: Haku
      subject: It is only through the eyes of others that our lives have any meaning.
    - body: Often people have it wrong, mistakenly believing... that showing mercy to an enemy is kindness. They spare the foe whose life is in their hands. But
        don't you see? It's an empty existence, to go on living... alone and unloved... when defeat's already cost you your dream!
      from_address: haku@konohagakure.fire.ninja
      from_name: Haku
      subject: Often people have it wrong, mistakenly believing... that showing mercy to an ene...
    - body: Often people have it wrong, mistakenly believing...that showing mercy to an enemy is kindness. They spare the foe whose life is in their hands...
        But don't you see? It's an empty existence... to go on living... alone and unloved... when defeat's already cost you your dream!
      from_address: haku@konohagakure.fire.ninja
