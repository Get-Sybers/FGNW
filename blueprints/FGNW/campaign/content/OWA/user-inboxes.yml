    - body: If the father's responsibility is to protect the child... then my responsibility is to exceed the father.
      from_address: naruto.uzumaki@konohagakure.fire.ninja
      from_name: Naruto Uzumaki
      subject: If the father's responsibility is to protect the child... then my responsibility...
    - body: Sasuke, I always knew you were alone. In the beginning I was glad because I thought you were like me - I wanted to talk to you! But you... didn't
        speak. You always had everyone watching you. You could do everything and we were too different. So I decided that you would become my rival. I didn't
        want to lose because I was called a loser all the time. Even when we became Team 7, I still thought this way. I always tried to lie but... but the truth
        is... I always wanted to be like you. I aspired to be like you. Because of that... I was glad that you wanted to fight me.
      from_address: naruto.uzumaki@konohagakure.fire.ninja
      from_name: Naruto Uzumaki
      subject: Sasuke, I always knew you were alone. In the beginning I was glad because I thou...
    - body: When people have different opinions, you should apply the majority vote.
