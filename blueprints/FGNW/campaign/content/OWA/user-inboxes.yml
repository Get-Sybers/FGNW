      from_name: Haku
      subject: By the way, I'm a boy.
    - body: Can you understand? Not having a dream... not being needed by anyone... The pain of merely being alive.
      from_address: haku@konohagakure.fire.ninja
      from_name: Haku
      subject: Can you understand? Not having a dream... not being needed by anyone... The pain...
    - body: I am of no more use as his tool. Please, kill me.
      from_address: haku@konohagakure.fire.ninja
