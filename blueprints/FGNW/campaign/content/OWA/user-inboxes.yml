      subject: The Uchiha is a clan destined for revenge...
    - body: I want to obtain all the jutsu and gain a true understanding of everything in this world. The first one to mix blue and yellow called the new color
        "green". I want to do something similar to that. If blue is the chakra, then yellow is the seal, and green is the jutsu... Just as there is no end to
        the variety of colors, there are so many thousands...tens of thousands of jutsu in the world as well. But in order to obtain every possible jutsu and
        truth, it would require an eternity. Only one who understands everything after spending such time on this can be fittingly called the Ultimate Being.
      from_address: orochimaru@otogakure.ninja
      from_name: Orochimaru
      subject: I want to obtain all the jutsu and gain a true understanding of everything in th...
  onoki:
    - body: I am a relic they want to get rid of, so why do I exist and live? In order to exist you need a purpose, to exist for no reason is the same as being
        dead... I would love only myself and fight for only myself. If all other people exist to magnify that love, then there is no more a splendid universe
        than this one...
      from_address: gaara@sunagakure.wind.ninja
      from_name: Gaara
      subject: I am a relic they want to get rid of, so why do I exist and live? In order to ex...
    - body: Naruto... Just so you know, there will be a war to protect the Eight-Tails and Nine-Tails. In other words - you. For the sake of the ninja world and
        as the Kazekage, I will guard you with my life. If as a member of Akatsuki, Sasuke Uchiha stands in the way of the ninja coalition... I will show him no
        mercy.
      from_address: gaara@sunagakure.wind.ninja
      from_name: Gaara
      subject: Naruto... Just so you know, there will be a war to protect the Eight-Tails and N...
    - body: Three times now... We've fought world wars for our own nations, our own villages. We've hurt one another. We've hated one another. That hatred bred
        a lust for power, and that lust for power created ME. I was a Jinchuuriki, the embodiment of hatred and power. And I hated this world, and all the
        people in it... I wanted to destroy it with my own hands. The exact same thing Akatsuki is trying to do today. But one man, one ninja from Konoha
        stopped me. I was his enemy, yet he wept for me! I hurt him, yet he called me his friend! He saved me! My enemy, my fellow Jinchuuriki... He suffered
        the same pain as me, yet bore no ill will! There are no enemies here because we've all suffered at Akatsuki's hand! SO THERE IS NO SAND, NO STONE, NO
        LEAF, NO MIST, NO CLOUD! THERE ARE ONLY SHINOBI! And if you still hold a grudge against the Sand, then when this war is over, come and take my head
        instead! Our enemies are after the friend who saved my life! If they take him, if we hand him over, our world is finished! I want to protect him, and I
        want to protect our world! But I'm too young to protect it all on my own! All of you lend me your aid!
      from_address: gaara@sunagakure.wind.ninja
      from_name: Gaara
      subject: Three times now... We've fought world wars for our own nations, our own villages...
