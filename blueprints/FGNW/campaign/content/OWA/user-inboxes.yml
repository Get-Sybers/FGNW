      from_name: Zabuza Momochi
      subject: "*to Kakashi* I died as a human!"
    - body: "*to Naruto* Your words cut deep, deeper than any blade."
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: "*to Naruto* Your words cut deep, deeper than any blade."
    - body: Even the unremarkable Demon of the Hidden Mist can die and become a real Demon in hell!
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: Even the unremarkable Demon of the Hidden Mist can die and become a real Demon i...
    - body: His soul was as pure as snow.
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: His soul was as pure as snow.
    - body: I can't think of a more fitting destination for a demon ninja, can you?! I'm told there are many demons down there - of all shapes and sizes! Oh
        yes, I should fit right in! You, on the other hand, Gatō... Well,I fear you're in for a long and very painful eternity!
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: I can't think of a more fitting destination for a demon ninja, can you?! I'm tol...
    - body: Uh uh...I won't be joining Haku. Where he's gone I cannot follow. We wouldn't be welcome where Haku's gone to. Hell's where WE'RE going, Gatō!
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: Uh uh...I won't be joining Haku. Where he's gone I cannot follow. We wouldn't be...
    - body: Well? Cat got your tongue? Are you so surprised to discover that I'm human? Even shinobi are human. No matter how hard we try, we always fail to
        escape that simple fact. Well at least, I have failed.
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: Well? Cat got your tongue? Are you so surprised to discover that I'm human? Even...
    - body: When I was your age, my hands were already soaked in blood...
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: When I was your age, my hands were already soaked in blood...
    - body: When you've hovered between life and death so many times that it doesn't faze you, you may be called a ninja. When you've become so deadly that your
        profile has been entered into my bingo book, then you may have earned the title ninja.
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: When you've hovered between life and death so many times that it doesn't faze yo...
    - body: You're right. Those little people and their little dreams, why should I care about them?! I have my own dream!
      from_address: zabuza.momochi@konohagakure.fire.ninja
      from_name: Zabuza Momochi
      subject: You're right. Those little people and their little dreams, why should I care abo...
  haku.edo:
    - body: Hehehe...you can't beat me. You have no skills, unlike Sasuke.
      from_address: kabuto.yakushi@otogakure.ninja
      from_name: Kabuto Yakushi
      subject: Hehehe...you can't beat me. You have no skills, unlike Sasuke.
  hanabi.hyuga:
    - body: I will never go back on my word, because that too is my ninja way!
      from_address: hinata.hyuga@konohagakure.fire.ninja
      from_name: Hinata Hyuga
      subject: I will never go back on my word, because that too is my ninja way!
    - body: "[To Hinata At Chuunin Exams] So you're not going to withdraw? Then don't blame me for what happens to you."
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: "[To Hinata At Chuunin Exams] So you're not going to withdraw? Then don't blame m..."
    - body: No one can determine another's destiny.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: No one can determine another's destiny.
    - body: There's no method but death to escape this horrible curse.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: There's no method but death to escape this horrible curse.
  hashirama.senju:
    - body: I am the Fifth Hokage... You've trampled on our ancestors treasure...their dream...and you will pay the price! As the Hokage, I will put a stop to
        you here and now!
      from_address: tsunade@konohagakure.fire.ninja
      from_name: Tsunade
      subject: I am the Fifth Hokage... You've trampled on our ancestors treasure...their dream...
  hashirama.senju.edo:
    - body: I decided I wished to be like you as well, FGNW-kun, and for that reason...with Orochimaru-sama now intregrated into this body, I plan on finding a
        new "me", one stronger than Orochimaru-sama himself!
      from_address: kabuto.yakushi@otogakure.ninja
      from_name: Kabuto Yakushi
      subject: I decided I wished to be like you as well, FGNW-kun, and for that reason...wit...
    - body: I want to know what an owl is doing here!
      from_address: tsunade@konohagakure.fire.ninja
      from_name: Tsunade
      subject: I want to know what an owl is doing here!
  hayate.gekkou:
    - body: Behind this mask is...Another mask! Pretty cool, huh?
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: Behind this mask is...Another mask! Pretty cool, huh?
    - body: In society, those who don't have many abilities, tend to complain more.
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: In society, those who don't have many abilities, tend to complain more.
    - body: DYNAMIC ENTRY!
      from_address: might.guy@konohagakure.fire.ninja
      from_name: Might Guy
      subject: DYNAMIC ENTRY!
    - body: That's it, Lee! Run...run towards the setting sun!... But don't mess up your hair!
      from_address: might.guy@konohagakure.fire.ninja
      from_name: Might Guy
      subject: That's it, Lee! Run...run towards the setting sun!... But don't mess up your hai...
  hiashi.hyuga:
    - body: I won't let you lay another finger on Naruto!
      from_address: hinata.hyuga@konohagakure.fire.ninja
      from_name: Hinata Hyuga
      subject: I won't let you lay another finger on Naruto!
    - body: All this time I've been called a genius, so I cannot lose.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: All this time I've been called a genius, so I cannot lose.
    - body: Once a failure, always a failure. You can't change that.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: Once a failure, always a failure. You can't change that.
    - body: You are the strongest enemy I have ever fought.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: You are the strongest enemy I have ever fought.
  hidan:
    - body: Even children are forced to grow up in the face of pain.
      from_address: pain@akatsuki.dark
      from_name: Pain
      subject: Even children are forced to grow up in the face of pain.
    - body: Justice comes from vengeance, but that justice only breeds more vengeance.
      from_address: pain@akatsuki.dark
      from_name: Pain
      subject: Justice comes from vengeance, but that justice only breeds more vengeance.
    - body: Sometimes you must hurt in order to know, fall in order to grow, lose in order to gain because life's greatest lessons are learned through pain.
      from_address: pain@akatsuki.dark
      from_name: Pain
      subject: Sometimes you must hurt in order to know, fall in order to grow, lose in order t...
  hinata.hyuga:
    - body: A wall's a wall and there's no wall I can't punch a hole through!
      from_address: kiba.inuzuka@konohagakure.fire.ninja
      from_name: Kiba Inuzuka
      subject: A wall's a wall and there's no wall I can't punch a hole through!
    - body: Hinata, untie the ropes before you faint.
      from_address: kiba.inuzuka@konohagakure.fire.ninja
      from_name: Kiba Inuzuka
      subject: Hinata, untie the ropes before you faint.
    - body: It's not bad enough they buried us alive in the oversized dung heap, but now they're stealing our chakra. You gotta give these guys credit for
        thoroughness!
      from_address: kiba.inuzuka@konohagakure.fire.ninja
      from_name: Kiba Inuzuka
      subject: It's not bad enough they buried us alive in the oversized dung heap, but now the...
    - body: Because Naruto... you saved me from the darkness.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: Because Naruto... you saved me from the darkness.
    - body: People share only one common fate... death.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: People share only one common fate... death.
    - body: I hate explaining the same thing twice.
      from_address: shino.aburame@konohagakure.fire.ninja
      from_name: Shino Aburame
      subject: I hate explaining the same thing twice.
    - body: Trying to improve by learning from others that is what calls friendship.
      from_address: shino.aburame@konohagakure.fire.ninja
      from_name: Shino Aburame
      subject: Trying to improve by learning from others that is what calls friendship.
  hinata.hyuga.adult:
    - body: Was I able to change myself...even a little, N-FGNW-kun?
      from_address: hinata.hyuga@konohagakure.fire.ninja
      from_name: Hinata Hyuga
      subject: Was I able to change myself...even a little, N-FGNW-kun?
    - body: Do you understand now? You have no way of beating me!
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: Do you understand now? You have no way of beating me!
    - body: Right now, Sasuke is in the darkness. The only one who can save him is you, Naruto.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: Right now, Sasuke is in the darkness. The only one who can save him is you, Naru...
  hiruzen.sarutobi:
    - body: "*about Sasuke* I don't care what the heck he is! If he stays, he's a danger to everyone! Don't
        you see!? As he gets stronger, so does the Curse Mark! That thing is feeding off his chakra! It's a
        Forbidden Jutsu that devours the one who bears it! It's incredible the kid's still standing. By now,
        he...should be dead."
      from_address: anko.mitarashi@konohagakure.fire.ninja
      from_name: Anko Mitarashi
      subject: "*about Sasuke* I don't care what the heck he is! If he stays, he's a danger to e..."
    - body: "*to Orochimaru* But why? How could you do this!? I don't get it, I've looked up to you more than anyone in the world!"
      from_address: anko.mitarashi@konohagakure.fire.ninja
      from_name: Anko Mitarashi
      subject: "*to Orochimaru* But why? How could you do this!? I don't get it, I've looked up ..."
    - body: I wasn't cast aside. It was my choice, and mine alone.
      from_address: anko.mitarashi@konohagakure.fire.ninja
      from_name: Anko Mitarashi
      subject: I wasn't cast aside. It was my choice, and mine alone.
    - body: "*making excuses for being late, as usual* A cute girl stopped me on the way, so I danced."
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: "*making excuses for being late, as usual* A cute girl stopped me on the way, so ..."
    - body: I don't know what this boy means to you, Gai, but I shouldn't have to tell you that we never bring our personal feelings into play. I didn't think
        you were capable of it.
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: I don't know what this boy means to you, Gai, but I shouldn't have to tell you t...
    - body: Like the fate of the two who founded the village of Konoha... Naruto and Sasuke...your fates are like theirs.
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: Like the fate of the two who founded the village of Konoha... Naruto and Sasuke....
    - body: "*to Naruto* Lord Jiraiya only had praise for you. He was always boasting about you, saying you
        were like his own grandchild. He had faith that you were the one who would inherit his will, and truly
        believed that you would one day be a great Hokage. Lord Jiraiya will always watch over you. Even this
        very minute, he's watching from somewhere. He wouldn't be happy seeing you sad like this. So...be your
        usual self, the one he praised so much. Don't stay depressed forever. For Lord Jiraiya himself, one of
        the Legendary Sannin...acknowledged you as his promising student!"
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: "*to Naruto* Lord Jiraiya only had praise for you. He was always boasting about y..."
    - body: "[About Naruto] Well that's typical. Not happy unless he's giving people a heart attack."
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: "[About Naruto] Well that's typical. Not happy unless he's giving people a heart ..."
    - body: "[as a child] Why should I be sad?! My parents died protecting the village from the monster fox.
        They're heroes, and I'm the son of those heroes! If I cry, it's because I'm happy! I'm not even sad
        that they went and left me all alone..."
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: "[as a child] Why should I be sad?! My parents died protecting the village from t..."
    - body: "[when Naruto transforms into a woman in front of the whole class] CUT THE STUPID TRICKS! THIS IS YOUR LAST WARNING!!"
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: "[when Naruto transforms into a woman in front of the whole class] CUT THE STUPID..."
    - body: I hate the fox, but the boy - I don't hate the boy.
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: I hate the fox, but the boy - I don't hate the boy.
    - body: It seems like the small leaves in the Village of Konoha have inherited that "will of fire" you spoke of, Third. The fire on the leaves will
        eventually burn greater and stronger... It will flash its light and protect this village.
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: It seems like the small leaves in the Village of Konoha have inherited that "wil...
    - body: So I acted like an idiot. It was tough, has it been lonely for you Naruto, was it tough Naruto??
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: So I acted like an idiot. It was tough, has it been lonely for you Naruto, was i...
    - body: When a person dies, he disappears, along with his past, current lifestyle, and his future. Many people die in missions and wars. They die easily and
        in surprisingly simple ways. Hayate was one of them. Those who die have goals and dreams. But everyone has something as important as those. Parents,
        siblings, friends, lovers... people who are important to you. They trust and help each other. The bond between the people important to you ever since
        birth and the string that binds them becomes thicker and stronger as time goes by... It's beyond reason. Those bound to you by that string will do that
        because it is important.
      from_address: iruka.umino@konohagakure.fire.ninja
      from_name: Iruka Umino
      subject: When a person dies, he disappears, along with his past, current lifestyle, and h...
    - body: "*to Kakashi* What is with your attitude?! We'll never be young like this again!"
      from_address: might.guy@konohagakure.fire.ninja
      from_name: Might Guy
      subject: "*to Kakashi* What is with your attitude?! We'll never be young like this again!"
    - body: It's not always possible to do what we want to do, but it's important to believe in something before you actually do it.
      from_address: might.guy@konohagakure.fire.ninja
      from_name: Might Guy
      subject: It's not always possible to do what we want to do, but it's important to believe...
    - body: You're right, all efforts are pointless... If you don't believe in yourself.
      from_address: might.guy@konohagakure.fire.ninja
      from_name: Might Guy
      subject: You're right, all efforts are pointless... If you don't believe in yourself.
    - body: Legends from the distant past are always exaggerated, but eventually, someone outdoes them... that's when new legends are born!
      from_address: shikaku.nara@konohagakure.fire.ninja
      from_name: Shikaku Nara
      subject: Legends from the distant past are always exaggerated, but eventually, someone ou...
    - body: Jiraiya, are you the one who taught him the Rasengan? Are you acting like a teacher by teaching him something he can't master? Don't give him any
        ideas! That's why this kid likes to daydream that he's going to become Hokage someday.
      from_address: tsunade@konohagakure.fire.ninja
      from_name: Tsunade
      subject: Jiraiya, are you the one who taught him the Rasengan? Are you acting like a teac...
  hiruzen.sarutobi.edo:
    - body: Little kids think life is so easy. That's why they go on and on about their dreams. That's why they never give up.
      from_address: kabuto.yakushi@otogakure.ninja
      from_name: Kabuto Yakushi
      subject: Little kids think life is so easy. That's why they go on and on about their drea...
    - body: People become stronger because they have things they cannot forget. That's what you call growth.
      from_address: tsunade@konohagakure.fire.ninja
      from_name: Tsunade
      subject: People become stronger because they have things they cannot forget. That's what ...
  hiruzen.young:
    - body: Grown-ups are idiots. If they really want to bring an end to this endless fighting, they need to sit down with one another and reach a truce.
      from_address: tobirama.senju@konohagakure.fire.ninja
      from_name: Tobirama Senju
      subject: Grown-ups are idiots. If they really want to bring an end to this endless fighti...
  hizashi.hyuga:
    - body: You're wrong, Neji... Because I can see that you are suffering more than me... You are the one who is confused and suffering inside the fate of the
        head and branch families.
      from_address: hinata.hyuga@konohagakure.fire.ninja
      from_name: Hinata Hyuga
      subject: You're wrong, Neji... Because I can see that you are suffering more than me... Y...
    - body: Father, is a person's destiny a thing like a cloud flowing with an inescapable flow? Or can a person choose the flow he wishes... I still don't know
        the answer to this. Either way the destination may be the same in the end. However by choosing to live like the latter, a person can live and strive
        towards a goal. And in this match I have finally understood those who have that are truly strong. Father, I have but one goal, I want to become
        stronger... Enough not to lose to anyone... That's how I feel. Father, the birds are flying freely today... They look so happy.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: Father, is a person's destiny a thing like a cloud flowing with an inescapable f...
    - body: Sasuke's out there right now, heading toward Orochimaru. We can't allow such evil to take someone from our village... that is not our way.
      from_address: neji.hyuga@konohagakure.fire.ninja
      from_name: Neji Hyuga
      subject: Sasuke's out there right now, heading toward Orochimaru. We can't allow such evi...
  ibiki.morino:
    - body: "*to Naruto* Tough guys like you usually leave their blood all over this forest."
      from_address: anko.mitarashi@konohagakure.fire.ninja
      from_name: Anko Mitarashi
      subject: "*to Naruto* Tough guys like you usually leave their blood all over this forest."
    - body: "*to Orochimaru* This is no time to reminisce, you're an S-class criminal, top of the most wanted
        list. You've got to be taken down, and it's only fitting that I'm the one to do it. 'Cause after all,
        you're the one that taught me everything, right, Sensei?"
      from_address: anko.mitarashi@konohagakure.fire.ninja
      from_name: Anko Mitarashi
      subject: "*to Orochimaru* This is no time to reminisce, you're an S-class criminal, top of..."
    - body: Time's a-wastin' people, let's go!
      from_address: anko.mitarashi@konohagakure.fire.ninja
      from_name: Anko Mitarashi
      subject: Time's a-wastin' people, let's go!
  ino.yamanaka:
    - body: "*to Shikamaru* I won't let even YOU eat the last barbecue chip!"
      from_address: choji.akimichi@konohagakure.fire.ninja
      from_name: Choji Akimichi
      subject: "*to Shikamaru* I won't let even YOU eat the last barbecue chip!"
    - body: Fat!? I'm big boned!
      from_address: choji.akimichi@konohagakure.fire.ninja
      from_name: Choji Akimichi
      subject: Fat!? I'm big boned!
    - body: This punch is heavier than life itself!
      from_address: choji.akimichi@konohagakure.fire.ninja
      from_name: Choji Akimichi
      subject: This punch is heavier than life itself!
    - body: "*about Temari* Subtle as a rhino... she might even be scarier than my mom."
      from_address: shikamaru.nara@konohagakure.fire.ninja
      from_name: Shikamaru Nara
      subject: "*about Temari* Subtle as a rhino... she might even be scarier than my mom."
    - body: "*To himself, while fighting Temari* Oh man... those clouds are so lucky. so free. More to the
        point, I didn't feel like doing this in the first place. And I only became a ninja because I thought
        life would've been more interesting as one... I suppose things aren't gonna be that simple."
      from_address: shikamaru.nara@konohagakure.fire.ninja
      from_name: Shikamaru Nara
      subject: "*To himself, while fighting Temari* Oh man... those clouds are so lucky. so free..."
    - body: How many times do I have to tell you? The first move is always a feint.
      from_address: shikamaru.nara@konohagakure.fire.ninja
      from_name: Shikamaru Nara
      subject: How many times do I have to tell you? The first move is always a feint.
    - body: In life, nothing good comes out of hurrying.
      from_address: shikamaru.nara@konohagakure.fire.ninja
      from_name: Shikamaru Nara
      subject: In life, nothing good comes out of hurrying.
    - body: Laziness is the mother of all bad habits. But ultimately she is a mother and we should respect her.
      from_address: shikamaru.nara@konohagakure.fire.ninja
      from_name: Shikamaru Nara
      subject: Laziness is the mother of all bad habits. But ultimately she is a mother and we ...
    - body: Someday, I just want to marry a regular girl who isn't too ugly and not too pretty. Have two children, first a girl, then a boy. Retire after my
        daughter is married and my son becomes a successful ninja, and spend the rest of my life playing shōgi or Go. Then die of old age before my wife.
      from_address: shikamaru.nara@konohagakure.fire.ninja
      from_name: Shikamaru Nara
      subject: Someday, I just want to marry a regular girl who isn't too ugly and not too pret...
    - body: We're not stupid enough to go out there planning to die.
      from_address: shikamaru.nara@konohagakure.fire.ninja
      from_name: Shikamaru Nara
      subject: We're not stupid enough to go out there planning to die.
    - body: Every one of us must do what's in their power! If we're going to die anyway, then it's better to die fighting than to do nothing!
      from_address: sakura.haruno@konohagakure.fire.ninja
      from_name: Sakura Haruno
      subject: Every one of us must do what's in their power! If we're going to die anyway, the...
  inoichi.yamanaka:
    - body: Oh, I'm sorry. Her head's so empty, so I mistook her for a vase and put flowers in her. You might want to spit that out quick, though. Those can be
        quite poisonous.
      from_address: ino.yamanaka@konohagakure.fire.ninja
      from_name: Ino Yamanaka
      subject: Oh, I'm sorry. Her head's so empty, so I mistook her for a vase and put flowers ...
  itachi.uchiha:
    - body: Because you're the only shinobi in the world who can surpass the Fourth. Thats what I believe.
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: Because you're the only shinobi in the world who can surpass the Fourth. Thats w...
    - body: If comrades that you trust gather around you, hope can take physical form and become visible. That`s what I believe...
      from_address: kakashi.hatake@konohagakure.fire.ninja
      from_name: Kakashi Hatake
      subject: If comrades that you trust gather around you, hope can take physical form and be...
    - body: "*last words* Itachi-san... It seems that in the end... I'm not so terrible after all."
      from_address: kisame.hoshigaki@akatsuki.dark
      from_name: Kisame Hoshigaki
      subject: "*last words* Itachi-san... It seems that in the end... I'm not so terrible after..."
    - body: Hmhmhmhm, I think I will play with you a bit before killing you!
      from_address: kisame.hoshigaki@akatsuki.dark
      from_name: Kisame Hoshigaki
      subject: Hmhmhmhm, I think I will play with you a bit before killing you!
    - body: I knew that from the first time I had to kill my comrades... Kill a Kiri ninja as a Kiri ninja. What does that make me? Am I a friend or foe? What
