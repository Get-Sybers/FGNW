    - body: "*to Minato, about his reason for attacking Konoha* Oh, you know...it's fun, it's part of my plan...to start a war...to bring peace..."
      from_address: madara.uchiha@akatsuki.dark
      from_name: Madara Uchiha
      subject: "*to Minato, about his reason for attacking Konoha* Oh, you know...it's fun, it's..."
    - body: Love is not necessary, power is the only true necessity.
