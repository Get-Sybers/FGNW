      subject: If you don't share someone's pain. You can never understand them.
  yamato:
    - body: "*to Sakumo* Regardless of what happened, you did the best you could. I understand that now...you
        broke the rules for all our sakes - I'm proud of you now..."
      from_address: kakashi.hatake@konohagakure.fire.ninja
