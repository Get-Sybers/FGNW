---
tool_categories:
  - name: Sealing Techniques (Credential Access)
    description: Extract and manipulate authentication materials — passwords, hashes, Kerberos tickets.
    tools:
      - name: Mimikatz
        description: Windows credential extraction (LSASS, SAM, DPAPI, Kerberos).
        filename: mimikatz.zip
        url: https://github.com/gentilkiwi/mimikatz/releases/latest/download/mimikatz_trunk.zip
      - name: Rubeus
        description: Kerberos ticket toolset — AS-REP roasting, Kerberoasting, ticket forging, S4U abuse.
        filename: Rubeus.exe
        url: https://github.com/r3motecontrol/Ghostpack-CompiledBinaries/raw/master/Rubeus.exe
      - name: CrackMapExec / NetExec
        description: Swiss-army knife for Windows network enumeration and credential spraying.
        filename: nxc
        url: https://github.com/Pennyw0rth/NetExec/releases/latest/download/nxc
      - name: Impacket scripts
        description: Python suite for SMB/Kerberos/DCSync/NTLM relay and more.
        filename: impacket.tar.gz
        url: https://github.com/fortra/impacket/archive/refs/heads/master.tar.gz
  - name: Shadow Clone Jutsu (Lateral Movement)
    description: Move through the network as a trusted identity — Pass-the-Hash, Pass-the-Ticket, WMI, PSExec.
    tools:
      - name: PsExec (Sysinternals)
        description: Remote command execution over SMB. Requires valid credentials or hash.
        filename: PsExec64.exe
        url: https://live.sysinternals.com/PsExec64.exe
      - name: Evil-WinRM
        description: WinRM shell with pass-the-hash and PowerShell remoting support.
        filename: evil-winrm
        url: https://github.com/Hackplayers/evil-winrm/releases/latest/download/evil-winrm.rb
      - name: SharpRDP
        description: Unauthenticated RDP execution via CredSSP pass-the-hash.
        filename: SharpRDP.exe
        url: https://github.com/0xthirteen/SharpRDP/releases/latest/download/SharpRDP.exe
      - name: Certipy
        description: Active Directory Certificate Services (ADCS) attack toolkit — ESC1-8.
        filename: certipy
        url: https://github.com/ly4k/Certipy/releases/latest/download/certipy
  - name: Byakugan / Sharingan (Reconnaissance)
    description: See through defences — network scanning, AD enumeration, BloodHound.
    tools:
      - name: Emulate config template
        description: Starter seed config for vercel-labs/emulate to stand up local API emulators used in phishing/OAuth flow simulation.
        filename: emulate.config.template.yml
        url: ""
        local_file: true
        local_source: "{{ playbook_dir }}/../content/www/emulate.config.template.yml"
      - name: GHOSTS client config template
        description: Starter application.json for cmu-sei/GHOSTS user-emulation clients. Set ApiRootUrl and pair it with a timeline before launching the client.
        filename: ghosts.client.application.template.json
        url: ""
        local_file: true
        local_source: "{{ playbook_dir }}/../content/www/ghosts.client.application.template.json"
      - name: BloodHound (data collector — SharpHound)
        description: Active Directory attack-path mapper. Run SharpHound on a domain-joined host to collect.
        filename: SharpHound.exe
        url: https://github.com/BloodHoundAD/SharpHound/releases/latest/download/SharpHound.exe
      - name: BloodHound CE
        description: Graph UI for SharpHound output. Run as a container on the attacker VM.
        filename: bloodhound-ce-setup.sh
        url: ""
        manual_install: true
      - name: Nmap
        description: Network port scanner and service fingerprinter.
        filename: nmap-setup.sh
        url: ""
        manual_install: true
      - name: Npcap (Windows packet-capture driver)
        description: wpcap.dll driver Windows nmap needs for raw-packet scans (-sS). Install with /S /winpcap_mode=yes. v1.50 is the last free build that
          honours the silent switch (newer free builds require the OEM installer for unattended install).
        filename: npcap-1.50.exe
        url: http://192.0.2.2:8081/repository/raw-hosted/tools/npcap-1.50.exe
      - name: VC++ x86 runtime (nmap dependency)
        description: Visual C++ x86 runtime that Windows nmap.exe needs to start (missing it = 0xC0000135 DLL_NOT_FOUND). Install silently with /install /quiet
          /norestart. This is the exact runtime bundled with nmap 7.92.
        filename: VC_redist.x86.exe
        url: http://192.0.2.2:8081/repository/raw-hosted/tools/VC_redist.x86.exe
      - name: ldapdomaindump
        description: LDAP AD enumeration — dumps users, groups, GPOs, trusts to JSON/HTML.
        filename: ldapdomaindump
        url: https://github.com/dirkjanm/ldapdomaindump/archive/refs/heads/master.tar.gz
      - name: PowerView
        description: PowerShell AD recon — SPN enumeration, ACL analysis, trust mapping.
        filename: PowerView.ps1
        url: https://raw.githubusercontent.com/PowerShellMafia/PowerSploit/master/Recon/PowerView.ps1
  - name: Fuinjutsu (Persistence & Evasion)
    description: Seal your foothold into the environment and avoid detection.
    tools:
      - name: SharPersist
        description: Windows persistence techniques — scheduled tasks, registry, startup.
        filename: SharPersist.exe
        url: https://github.com/mandiant/SharPersist/releases/latest/download/SharPersist.exe
      - name: Covenant C2 (stager generator)
        description: C2 framework — used for generating stagers only in this lab; full server not deployed here.
        filename: covenant-stager-notes.txt
        url: ""
        manual_install: true
      - name: Chisel
        description: Fast TCP/UDP tunnel over HTTP — for port forwarding through restricted networks.
        filename: chisel_linux_amd64.gz
        url: https://github.com/jpillora/chisel/releases/latest/download/chisel_linux_amd64.gz
