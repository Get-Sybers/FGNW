          Portable Windows nmap — no installer, no Npcap GUI (7.92 is the last portable
          release). The tool-cache fetches it from the NEXUS cache (raw-hosted), not the public
          internet, and re-serves it at /tools/nmap-7.92-win32.zip. Range workstations pull it
          from here (see ansible/FGNW-recon-tooling.yml) so they never touch the internet.
        filename: nmap-7.92-win32.zip
        url: http://192.0.2.2:8081/repository/raw-hosted/tools/nmap-7.92-win32.zip
