# Thin Packer entry point. The play (and its action, the windows_ngen role) ships
# once in the get_sybers.templates collection; the Packer `shell-local` provisioner
# installs it (../../requirements.yml) and the `ansible` one runs this wrapper.
- name: Precompile the .NET native images (get_sybers.templates ngen play)
  ansible.builtin.import_playbook: get_sybers.templates.ngen
