---
# Collections the build-time bake play (ansible/ninjasploitable-bake.yml) needs,
# installed by the Packer `ansible` provisioner's galaxy_file so the template builds
# standalone (`ludus templates add -d templates/ninjasploitable`; the build host has
# internet, per the README):
#   community.general -> apache2_module (enable php / rewrite / headers)
#   community.mysql   -> mysql_user / mysql_db (root-passwordless + vulnerable_db)
# ansible.builtin modules need no collection.
#
# NOTE: left unpinned because this environment cannot reach Ansible Galaxy to choose
# versions compatible with the Ludus packer host's ansible-core. ansible-standards
# §9a wants an exact version on each entry -- set them once a compatible version is
# confirmed on the build host.
collections:
  - name: community.general
  - name: community.mysql
