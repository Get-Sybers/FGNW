d-i partman/early_command \
       string debconf-set partman-auto/disk "$(list-devices disk | head -n1)"
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string metasploitable2
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i passwd/root-password password root
d-i passwd/root-password-again password root
d-i passwd/user-fullname string debian
d-i passwd/username string debian
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean true
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select single-root-no-swap
d-i partman-auto/expert_recipe string                         \
      single-root-no-swap ::                                  \
              1000 50 -1 ext4                                 \
                      filesystem{ ext4 }                      \
                      method{ format } format{ }              \
                      use_filesystem{ }                       \
                      mountpoint{ / }                         \
              .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i	partman-basicfilesystems/no_swap	boolean	false
d-i partman/mount_style select traditional
d-i base-installer/install-recommends boolean false
apt-cdrom-setup	apt-setup/disable-cdrom-entries	boolean	true
apt-cdrom-setup	apt-setup/cdrom/set-first	boolean	false
tasksel tasksel/first multiselect SSH server
d-i pkgsel/include string haveged openssh-server sudo qemu-guest-agent python3 acpid acpi-support dbus ca-certificates curl wget vim resolvconf
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev  string default
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string echo 'debian ALL = (root) NOPASSWD: ALL' > /target/etc/sudoers.d/debian
